name: Android Release (Play)

# Builds a SIGNED Android App Bundle and uploads it to Google Play.
# Removes the "release only builds on one laptop" gap: the upload keystore lives
# as CI secrets, the build is reproducible, and the AAB lands on a Play track.
#
# Trigger: normally called by release-native.yml. A manual run on `dev` with no
# versionName rebuilds the current tagged Android version only: versionName stays
# put, Play receives a new monotonic versionCode, the shared iOS OTA floor does
# not advance, and a credentialless follow-up job records the attested Android
# baseline for later OTAs. A manually supplied version or v* tag remains break-glass.
# Prereq: fix/native-build-reliability must be merged (card-comparison static-export
#         fix) or `native:release` will fail to build.
#
# Required repo secrets (see docs/NATIVE-RELEASE.md §Ops):
#   ANDROID_KEYSTORE_BASE64      base64 of the upload keystore
#   ANDROID_KEYSTORE_PASSWORD    store password
#   ANDROID_KEY_ALIAS            key alias (e.g. peanut)
#   ANDROID_KEY_PASSWORD         key password
#   PLAY_SERVICE_ACCOUNT_JSON    Google Play Developer API service-account JSON
#   SUBMODULE_TOKEN              read access to the src/content submodule
# Plus the production NEXT_PUBLIC_* the static export bakes in (see the env step).

on:
    workflow_call:
        inputs:
            versionName:
                description: 'Resolved <major>.<build>.0 version to ship'
                required: true
                type: string
            track:
                description: 'Play track'
                required: false
                default: 'internal'
                type: string
            pushDebug:
                description: 'Enable OneSignal verbose logging in this build'
                required: false
                default: false
                type: boolean
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            track:
                description: 'Play track'
                required: true
                default: 'internal'
                type: choice
                options: [internal, alpha, beta, production]
            versionName:
                description: 'Leave blank to rebuild the current Android version on dev; explicit values are break-glass'
                required: false
                type: string
            pushDebug:
                description: 'Enable OneSignal verbose logging in this build'
                required: false
                default: false
                type: boolean

permissions:
    contents: read

concurrency:
    # A break-glass `v*` tag push and the sanctioned blank-version replacement both
    # write the production Capgo channel, so they join the release mutex. When
    # release-native.yml calls this workflow it passes versionName and already holds
    # that mutex; its child keeps a separate group instead of deadlocking its parent.
    # A direct dispatch with an explicit version remains deepest break-glass.
    group: >-
        ${{ github.event_name == 'push' && 'production-release'
        || (inputs.versionName == '' && 'production-release')
        || format('android-release-{0}', github.ref) }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.name }}
            rebuild: ${{ steps.version.outputs.rebuild }}
        # Protect with required reviewers in repo Settings → Environments → Production.
        environment: Production
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  # Direct replacement builds resolve and compare against the
                  # current native tag, so a shallow checkout is not sufficient.
                  fetch-depth: 0
                  submodules: recursive
                  token: ${{ secrets.SUBMODULE_TOKEN }}

            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: '22' # @sentry/profiling-node has no Node 25 binary; project targets 22
                  cache: 'pnpm'

            - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
              with:
                  distribution: 'temurin'
                  java-version: '21' # Capacitor 8's capacitor-android compiles at source 21

            - name: Install dependencies
              run: pnpm install

            - name: Decode upload keystore
              env:
                  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: |
                  echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/peanut-release.keystore
                  cat > android/keystore.properties <<EOF
                  storeFile=../peanut-release.keystore
                  storePassword=${ANDROID_KEYSTORE_PASSWORD}
                  keyAlias=${ANDROID_KEY_ALIAS}
                  keyPassword=${ANDROID_KEY_PASSWORD}
                  EOF

            - name: Production web env
              run: |
                  # NEXT_PUBLIC_* values are baked into the static export at build time.
                  # rpId MUST be peanut.me (passkeys + assetlinks/AASA).
                  # Keep this block identical to ios-release.yml / android-release.yml /
                  # capgo-deploy.yml. CAPACITOR_BUILD / IS_NATIVE_BUILD / GIT_COMMIT_HASH
                  # are auto-baked by next.config.native.js.
                  # Delimiter is quoted: a secret holding $ or a backtick must land in the
                  # file verbatim, not be expanded — or executed — by the shell.
                  cat > .env.production.local <<'EOF'
                  NEXT_PUBLIC_BASE_URL=https://peanut.me
                  NEXT_PUBLIC_PEANUT_API_URL=${{ vars.NEXT_PUBLIC_PEANUT_API_URL }}
                  NEXT_PUBLIC_NATIVE_RP_ID=peanut.me
                  NEXT_PUBLIC_ZERO_DEV_BUNDLER_URL=${{ secrets.NEXT_PUBLIC_ZERO_DEV_BUNDLER_URL }}
                  NEXT_PUBLIC_ZERO_DEV_PAYMASTER_URL=${{ secrets.NEXT_PUBLIC_ZERO_DEV_PAYMASTER_URL }}
                  NEXT_PUBLIC_ZERO_DEV_PASSKEY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_ZERO_DEV_PASSKEY_PROJECT_ID }}
                  NEXT_PUBLIC_ZERO_DEV_RECOVERY_BUNDLER_URL=${{ secrets.NEXT_PUBLIC_ZERO_DEV_RECOVERY_BUNDLER_URL }}
                  NEXT_PUBLIC_JUSTANAME_ENS_DOMAIN=peanut.me
                  NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
                  NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
                  NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
                  NEXT_PUBLIC_GA_KEY=${{ vars.NEXT_PUBLIC_GA_KEY }}
                  NEXT_PUBLIC_ONESIGNAL_APP_ID=${{ secrets.NEXT_PUBLIC_ONESIGNAL_APP_ID }}
                  NEXT_PUBLIC_SAFARI_WEB_ID=${{ vars.NEXT_PUBLIC_SAFARI_WEB_ID }}
                  NEXT_PUBLIC_ONESIGNAL_WEBHOOK=${{ vars.NEXT_PUBLIC_ONESIGNAL_WEBHOOK }}
                  EOF
                  if [ "${{ inputs.pushDebug }}" = "true" ]; then
                      echo "NEXT_PUBLIC_ONESIGNAL_DEBUG=true" >> .env.production.local
                  fi

            - name: Resolve release versionName
              id: version
              env:
                  INPUT_VERSION: ${{ inputs.versionName || '' }}
              run: |
                  # release-native.yml resolves the version and passes it here, so the
                  # input wins; a break-glass tag push falls back to the tag name minus
                  # its leading 'v' (v1.1.0 -> 1.1.0). Either way it is validated against
                  # the release scheme before the build starts. Resolved once, up front,
                  # so the OTA floor check and the bundle publish below see the exact
                  # version the binary ships with. Keep in lockstep with ios-release.yml.
                  VERSION_NAME="$INPUT_VERSION"
                  DIRECT_REBUILD=false
                  if [ -z "$VERSION_NAME" ] && [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then
                      if [ "$GITHUB_REF_NAME" != "dev" ]; then
                          echo "::error::Android replacement builds are cut from dev, not $GITHUB_REF_NAME" >&2
                          exit 1
                      fi
                      VERSION_NAME="$(node scripts/release-version.mjs native-floor)"
                      node scripts/check-native-capabilities.mjs "v$VERSION_NAME"
                      node scripts/check-native-change-scope.cjs "v$VERSION_NAME" android --legacy-compatible
                      DIRECT_REBUILD=true
                  fi
                  if [ -z "$VERSION_NAME" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
                      VERSION_NAME="${GITHUB_REF_NAME#v}"
                  fi
                  if [ -z "$VERSION_NAME" ]; then
                      echo "::error::no versionName — call this from release-native.yml, or push a vX.Y.0 tag" >&2
                      exit 1
                  fi
                  node scripts/release-version.mjs validate "$VERSION_NAME" --kind native
                  echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
                  echo "rebuild=$DIRECT_REBUILD" >> "$GITHUB_OUTPUT"
                  echo "Release versionName: $VERSION_NAME"

            # A binary whose versionName is ahead of the newest production OTA bundle
            # makes Capgo's disable_auto_update_under_native rule reject every bundle
            # on those devices — OTA goes silently dead for the whole fleet while CI
            # stays green (TASK-21793: 102 devices, a month of refused updates). Read
            # the floor before the long build; the publish step after the store
            # upload closes the gap this detects. Keep in lockstep with
            # ios-release.yml.
            - name: Check production OTA floor
              id: ota_floor
              env:
                  CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
                  VERSION_NAME: ${{ steps.version.outputs.name }}
                  IS_REBUILD: ${{ steps.version.outputs.rebuild }}
              run: |
                  CURRENT="$(npx @capgo/cli@8.42.4 channel currentBundle production \
                    --apikey "$CAPGO_API_KEY" --quiet | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' | tail -n1 || true)"
                  if [ -z "$CURRENT" ]; then
                      echo "::error::cannot read the production channel's current bundle from Capgo — refusing to ship a binary that may strand the fleet's OTA path" >&2
                      exit 1
                  fi
                  # Fail closed on an anomalous read. CURRENT is scraped from a CLI
                  # whose stdout format is not contractual, so a stray version-like
                  # token that sorts ABOVE a new release would make needs_ota false,
                  # silently skip the matching publish, and recreate TASK-21793 with
                  # CI green. A same-build replacement is the one valid exception:
                  # its existing .1+ OTA is expected to sort above the rebuilt .0.
                  if [ "$(node scripts/semver-newer.mjs "$CURRENT" "$VERSION_NAME")" = "true" ]; then
                      CURRENT_CORE="${CURRENT%%-*}"
                      if [ "$IS_REBUILD" != "true" ] || [ "${CURRENT_CORE%.*}" != "${VERSION_NAME%.*}" ]; then
                          echo "::error::production bundle $CURRENT sorts above the release $VERSION_NAME — impossible for a new release, so the channel read is unreliable; refusing to ship" >&2
                          exit 1
                      fi
                      echo "Replacement build $VERSION_NAME remains covered by production OTA $CURRENT"
                  fi
                  NEEDS_OTA="$(node scripts/semver-newer.mjs "$VERSION_NAME" "$CURRENT")"
                  echo "needs_ota=$NEEDS_OTA" >> "$GITHUB_OUTPUT"
                  if [ "$NEEDS_OTA" = "true" ]; then
                      echo "versionName $VERSION_NAME is ahead of production bundle $CURRENT — a matching bundle ships after the store upload"
                  else
                      echo "versionName $VERSION_NAME is covered by production bundle $CURRENT"
                  fi

            - name: Write MeaWallet config
              # mea_config for the MPP SDK (Google Pay push provisioning) —
              # gitignored; bundled from res/raw when present, no-op until the
              # secret is provisioned.
              env:
                  MEA_CONFIG: ${{ secrets.MEAWALLET_CONFIG_BASE64 }}
              run: |
                  if [ -n "$MEA_CONFIG" ]; then
                      mkdir -p android/app/src/main/res/raw
                      echo "$MEA_CONFIG" | base64 -d > android/app/src/main/res/raw/mea_config
                      echo "mea_config written"
                  else
                      echo "::error::MEAWALLET_CONFIG_BASE64 is required for a production native release"
                      exit 1
                  fi

            - name: Build signed AAB
              env:
                  # native sentry sdk dsn — read by android/app/build.gradle into a
                  # manifest placeholder. same project dsn the js layer bakes into
                  # the static export above; no new secret needed.
                  SENTRY_DSN_ANDROID: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
                  # MeaWallet MPP SDK — gradle gates both the dependency and the
                  # plugin source on these; production must never compile the stub.
                  # Android-specific names: see the note in ios-release.yml.
                  PEANUT_REQUIRE_PUSH_PROVISIONING: '1'
                  MEAWALLET_NEXUS_USER: ${{ secrets.MEAWALLET_NEXUS_USER_ANDROID }}
                  MEAWALLET_NEXUS_PASSWORD: ${{ secrets.MEAWALLET_NEXUS_PASSWORD_ANDROID }}
                  ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
              run: |
                  # versionCode must increase in UPLOAD order, which is not run
                  # order: GitHub preserves run_number when you re-run an older
                  # workflow and only bumps run_attempt, so any run-numbered or
                  # version-derived code goes backwards when dispatch 1 is
                  # re-run after dispatch 2 has already uploaded — and Play
                  # refuses the recovery upload, leaving the retry wedged.
                  # scripts/android-version-code.mjs uses wall-clock seconds,
                  # the only value monotonic by construction rather than by an
                  # argument about GitHub's numbering. See the header there for
                  # the two schemes this replaces.
                  ANDROID_VERSION_CODE="$(node scripts/android-version-code.mjs)"
                  export ANDROID_VERSION_CODE
                  echo "versionCode $ANDROID_VERSION_CODE (version $ANDROID_VERSION_NAME, run $GITHUB_RUN_NUMBER attempt $GITHUB_RUN_ATTEMPT)"
                  pnpm native:release

            - name: Verify Capacitor permission metadata survived R8
              run: |
                  DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump -print | sort -V | tail -n1)"
                  if [ -z "$DEXDUMP" ]; then
                      echo "::error::dexdump is unavailable; cannot verify the optimized artifact" >&2
                      exit 1
                  fi

                  mapfile -t DEX_FILES < <(find android/app/build/intermediates/dex/release/minifyReleaseWithR8 -maxdepth 1 -type f -name 'classes*.dex' -print | sort)
                  if [ "${#DEX_FILES[@]}" -eq 0 ]; then
                      echo "::error::R8 produced no release DEX files to inspect" >&2
                      exit 1
                  fi

                  CAMERA_ANNOTATION='VISIBILITY_RUNTIME Lcom/getcapacitor/annotation/CapacitorPlugin; name="Camera" permissions={'
                  FOUND=false
                  for DEX in "${DEX_FILES[@]}"; do
                      if "$DEXDUMP" -a "$DEX" | grep -F "$CAMERA_ANNOTATION" >/dev/null; then
                          FOUND=true
                          break
                      fi
                  done
                  if [ "$FOUND" != "true" ]; then
                      echo "::error::CameraPlugin lost its runtime Capacitor permission metadata during R8; refusing to upload a crash-prone AAB" >&2
                      exit 1
                  fi
                  echo "CameraPlugin runtime permission metadata is present in the optimized DEX"

            - name: Preserve R8 mapping
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: android-r8-mapping-${{ steps.version.outputs.name }}-${{ github.run_id }}-${{ github.run_attempt }}
                  path: android/app/build/outputs/mapping/release/
                  if-no-files-found: error

            - name: Upload to Google Play
              uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
              with:
                  serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
                  packageName: me.peanut.wallet
                  releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
                  tracks: ${{ inputs.track || 'internal' }}
                  status: completed
                  # Staged production rollout: set status: inProgress + userFraction: 0.1,
                  # then promote in Play Console once crash/error rates look clean.

            # The binary that just shipped is ahead of every production OTA bundle, so
            # its devices would refuse all existing bundles. Publish the exact JS baked
            # into this binary (native:release leaves it in out/) under the binary's own
            # version — the lanes can no longer drift apart. A failure here is the floor
            # guard firing: the job goes red instead of the fleet going silently dark.
            # Upload flags in lockstep with capgo-deploy.yml; ios-release.yml publishes
            # the same version from the same tag, which --version-exists-ok turns into a
            # verified no-op.
            - name: Publish matching production OTA bundle
              if: steps.ota_floor.outputs.needs_ota == 'true'
              env:
                  CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
                  CAPGO_PRIVATE_KEY: ${{ secrets.CAPGO_PRIVATE_KEY }}
                  VERSION: ${{ steps.version.outputs.name }}
              run: |
                  if [ ! -f out/index.html ]; then
                      echo "::error::out/ is missing its static export — cannot publish the matching OTA bundle, and without it every device on the $VERSION binary refuses OTA updates" >&2
                      exit 1
                  fi
                  npx @capgo/cli@8.42.4 bundle upload \
                    --channel production \
                    --apikey "$CAPGO_API_KEY" \
                    --key-data-v2 "$CAPGO_PRIVATE_KEY" \
                    --path ./out \
                    --bundle "$VERSION" \
                    --min-update-version "$VERSION" \
                    --version-exists-ok \
                    --comment "${GITHUB_SHA:0:7} — auto-published with the $VERSION native release"
                  CURRENT="$(npx @capgo/cli@8.42.4 channel currentBundle production \
                    --apikey "$CAPGO_API_KEY" --quiet | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' | tail -n1 || true)"
                  if [ "$CURRENT" != "$VERSION" ]; then
                      echo "::error::production channel serves '${CURRENT:-<none>}', expected $VERSION — devices on the $VERSION binary have no OTA path" >&2
                      exit 1
                  fi
                  echo "Production channel now serves $VERSION"

            - name: Upload AAB as build artifact
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: app-release-aab
                  path: android/app/build/outputs/bundle/release/app-release.aab
                  if-no-files-found: warn

    # A same-version replacement must leave a durable OTA baseline, but the
    # production build job should not receive repository write access. This
    # separate job has no release environment or secrets and runs only after
    # Play upload/build completion. Its sole write is one annotated tag.
    record-replacement-baseline:
        needs: release
        if: needs.release.outputs.rebuild == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: '22'

            - name: Record attested Android replacement
              env:
                  VERSION: ${{ needs.release.outputs.version }}
              run: |
                  node scripts/check-native-change-scope.cjs "v$VERSION" android --legacy-compatible --ref "$GITHUB_SHA"
                  FINGERPRINT="$(node scripts/native-fingerprint.mjs --ref "$GITHUB_SHA")"
                  TAG="android-v${VERSION}-replacement-${GITHUB_SHA:0:12}"
                  ATTESTATION="peanut-native-replacement-v2: platform=android base=v$VERSION native-compatible=true js-guard=android-capacitor-permissions-v1 fingerprint=$FINGERPRINT"

                  if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
                      EXISTING_COMMIT="$(git rev-parse "$TAG^{commit}")"
                      if [ "$EXISTING_COMMIT" != "$GITHUB_SHA" ]; then
                          echo "::error::$TAG points at $EXISTING_COMMIT, expected $GITHUB_SHA" >&2
                          exit 1
                      fi
                      node scripts/check-native-ota-surface.mjs "v$VERSION" --platform android --ref "$GITHUB_SHA"
                      echo "$TAG already records this replacement"
                  else
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git tag -a "$TAG" "$GITHUB_SHA" -m "Android $VERSION replacement" -m "$ATTESTATION"
                      node scripts/check-native-ota-surface.mjs "v$VERSION" --platform android --ref "$GITHUB_SHA"
                      git push origin "$TAG"
                      echo "Recorded $TAG at ${GITHUB_SHA:0:12}"
                  fi
