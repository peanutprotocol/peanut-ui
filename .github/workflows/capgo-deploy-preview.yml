name: Deploy OTA Update — mobile-release preview (Capgo)

# Per-commit OTA preview lane for the mobile-release branch, on BOTH platforms.
#
# Production and staging live on the `production` / `staging` channels
# (capgo-deploy.yml). This workflow never touches them: it publishes to two
# dedicated preview channels that devices must be pointed at deliberately, so a
# push here can't reach a production user on either platform.
#
# One build, one bundle, two channels — the JS is identical, so uploading it
# twice would only create a way for the platforms to drift apart.
#
# Getting a device onto a preview channel: the channels allow self-assign, but
# nothing in the app calls setChannel(), so in practice a tester's device is
# assigned to the channel from the Capgo dashboard. Creating the channel is not
# by itself enough to make a device receive these builds.

on:
    push:
        branches: [mobile-release]
    workflow_dispatch:
        inputs:
            iosChannel:
                description: 'iOS preview channel'
                required: false
                default: 'ios-mobile-release'
                type: string
            androidChannel:
                description: 'Android preview channel'
                required: false
                default: 'android-mobile-release'
                type: string

permissions:
    contents: read

concurrency:
    group: capgo-deploy-preview-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}

            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

            - uses: actions/setup-node@v6
              with:
                  node-version: '20'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - name: Build native static export
              run: node scripts/native-build.js

            - name: Verify build output
              run: |
                  test -d out && test -f out/index.html || (echo "ERROR: out/ directory missing or incomplete" && exit 1)
                  echo "Bundle ready. File count: $(find out -type f | wc -l)"

            - name: Resolve channels
              id: channels
              run: |
                  echo "ios=${{ github.event.inputs.iosChannel || 'ios-mobile-release' }}" >> "$GITHUB_OUTPUT"
                  echo "android=${{ github.event.inputs.androidChannel || 'android-mobile-release' }}" >> "$GITHUB_OUTPUT"

            # Best-effort: create each channel and lock it to one platform. Idempotent
            # and non-fatal — if a channel already exists or its flags differ, the
            # upload below still runs and the flags can be set once in the Capgo
            # dashboard (one platform on, the other off, self-assign on).
            #
            # The platform locks are what keep the lanes separate: without
            # --no-android on the iOS channel an Android device assigned to it would
            # pull an iOS preview build, and vice versa.
            - name: Ensure preview channels exist
              continue-on-error: true
              env:
                  CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
              run: |
                  npx @capgo/cli@latest channel add "${{ steps.channels.outputs.ios }}" --apikey "$CAPGO_API_KEY" || true
                  npx @capgo/cli@latest channel set "${{ steps.channels.outputs.ios }}" \
                    --apikey "$CAPGO_API_KEY" \
                    --ios --no-android --self-assign

                  npx @capgo/cli@latest channel add "${{ steps.channels.outputs.android }}" --apikey "$CAPGO_API_KEY" || true
                  npx @capgo/cli@latest channel set "${{ steps.channels.outputs.android }}" \
                    --apikey "$CAPGO_API_KEY" \
                    --android --no-ios --self-assign

            - name: Upload bundle to Capgo
              id: upload
              # Pass the commit message via env, never inline — a multi-line message
              # (or one containing quotes) injected into the run script breaks the
              # --comment quoting and spills into positional args. Use its first line.
              env:
                  CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
                  # Private E2E signing key. Its public half is baked into
                  # capacitor.config.ts, so the app only accepts bundles signed here —
                  # the same key the production lane uses.
                  CAPGO_PRIVATE_KEY: ${{ secrets.CAPGO_PRIVATE_KEY }}
                  COMMIT_MSG: ${{ github.event.head_commit.message }}
              run: |
                  # Capgo defaults the bundle version to package.json's, so any push
                  # that doesn't bump it collides ("Version x already exists"). This is
                  # a per-commit preview lane, so suffix the short SHA to stay unique.
                  VERSION="$(node -p "require('./package.json').version")-${GITHUB_SHA:0:7}"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  COMMENT="preview ${GITHUB_SHA:0:7} — $(printf '%s' "${COMMIT_MSG:-manual deploy}" | head -n1)"
                  npx @capgo/cli@latest bundle upload \
                    --channel "${{ steps.channels.outputs.ios }}" \
                    --apikey "$CAPGO_API_KEY" \
                    --key-data-v2 "$CAPGO_PRIVATE_KEY" \
                    --path ./out \
                    --bundle "$VERSION" \
                    --auto-min-update-version \
                    --comment "$COMMENT"

            # Link the SAME bundle to the Android channel rather than uploading it
            # again — a second upload would need a second version string, and the two
            # platforms would silently stop being the same build.
            - name: Point the Android preview channel at that bundle
              env:
                  CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
              run: |
                  npx @capgo/cli@latest channel set "${{ steps.channels.outputs.android }}" \
                    --apikey "$CAPGO_API_KEY" \
                    --bundle "${{ steps.upload.outputs.version }}"

            - name: Deployment summary
              run: |
                  echo "## mobile-release OTA preview" >> $GITHUB_STEP_SUMMARY
                  echo "- **iOS channel:** ${{ steps.channels.outputs.ios }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Android channel:** ${{ steps.channels.outputs.android }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Bundle version:** ${{ steps.upload.outputs.version }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "Devices receive this only if assigned to one of the channels above." >> $GITHUB_STEP_SUMMARY
