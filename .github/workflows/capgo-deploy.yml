name: Deploy OTA Update (Capgo)

on:
    # Production OTA reaches every shipped iOS and Android install, so it is opt-in
    # per release and never a side effect of pushing code: it fires on an `ota-*`
    # tag and nothing else. Pushing to mobile-release builds and lands code; tagging
    # is the separate, deliberate act that says "ship this JS to everyone", and the
    # tag is a permanent record of exactly which commit went out.
    #
    #   git tag ota-1.0.48 && git push origin ota-1.0.48
    #
    # The bundle version is taken from the tag (ota-1.0.48 -> 1.0.48), so each
    # shipped bundle is named by the tag that shipped it and two OTAs can never
    # collide on one version. `ota-1.0.48-hotfix1` is a valid follow-up on the same
    # native build.
    #
    # Deliberately NOT `v*`: ios-release.yml and android-release.yml already claim
    # that prefix for native store builds, and a JS-only OTA must not be able to
    # trigger those or vice versa.
    #
    # `dev` still auto-ships to staging, which reaches no production device.
    #
    # NOTE: the tag is currently the only approval step. The job declares the
    # Production environment below, but that environment has no protection rules
    # (verified 2026-08-06 via `gh api repos/:owner/:repo/environments`), so it
    # gates nothing yet — adding required reviewers there makes the tag push queue
    # for a second human, with no change to this file.
    push:
        branches: [dev]
        tags: ['ota-*']
    workflow_dispatch:
        inputs:
            channel:
                description: 'Capgo channel to deploy to'
                required: true
                default: 'production'
                type: choice
                options:
                    - development
                    - staging
                    - production

permissions:
    contents: read

concurrency:
    group: capgo-deploy-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        # Scope the Production environment to production deploys only, so the
        # dev→staging auto-push is never paused. NOTE: this environment has no
        # protection rules today, so declaring it gates nothing — see the warning at
        # the top of this file. It is wired up so that adding required reviewers in
        # Settings → Environments → Production takes effect without touching CI.
        #
        # Must be an expression over the event, not the resolved channel below: GitHub
        # picks the environment before any step runs, so it cannot read a step output.
        # Keep the two in sync — every branch that resolves to `production` needs to
        # appear here, or its deploy would reach all users with no approval.
        environment: >-
            ${{ ((github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'production')
            || startsWith(github.ref, 'refs/tags/ota-')) && 'Production' || '' }}
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}

            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

            - uses: actions/setup-node@v6
              with:
                  node-version: '20'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            # Keep this block identical to ios-release.yml / android-release.yml /
            # capgo-deploy.yml. It was missing here since the lane was created, so every
            # production OTA bundle shipped with all NEXT_PUBLIC_* undefined: recognizeQr
            # threw on BASE_URL and Sentry/PostHog never initialised — mono
            # `ops/native-ota-envless-bundle-rca.md`. native-build.js now fails in CI when
            # the file is missing.
            - name: Bake production NEXT_PUBLIC_* into the static export
              run: |
                  # NEXT_PUBLIC_* values are baked into the static export at build time.
                  # rpId MUST be peanut.me (passkeys + assetlinks/AASA). CAPACITOR_BUILD /
                  # IS_NATIVE_BUILD / GIT_COMMIT_HASH are auto-baked by next.config.native.js.
                  cat > .env.production.local <<EOF
                  NEXT_PUBLIC_BASE_URL=https://peanut.me
                  NEXT_PUBLIC_PEANUT_API_URL=${{ vars.NEXT_PUBLIC_PEANUT_API_URL }}
                  NEXT_PUBLIC_NATIVE_RP_ID=peanut.me
                  NEXT_PUBLIC_ZERO_DEV_BUNDLER_URL=${{ secrets.NEXT_PUBLIC_ZERO_DEV_BUNDLER_URL }}
                  NEXT_PUBLIC_ZERO_DEV_PAYMASTER_URL=${{ secrets.NEXT_PUBLIC_ZERO_DEV_PAYMASTER_URL }}
                  NEXT_PUBLIC_ZERO_DEV_PASSKEY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_ZERO_DEV_PASSKEY_PROJECT_ID }}
                  NEXT_PUBLIC_ZERO_DEV_RECOVERY_BUNDLER_URL=${{ secrets.NEXT_PUBLIC_ZERO_DEV_RECOVERY_BUNDLER_URL }}
                  NEXT_PUBLIC_JUSTANAME_ENS_DOMAIN=peanut.me
                  NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
                  NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
                  NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
                  NEXT_PUBLIC_GA_KEY=${{ vars.NEXT_PUBLIC_GA_KEY }}
                  NEXT_PUBLIC_ONESIGNAL_APP_ID=${{ secrets.NEXT_PUBLIC_ONESIGNAL_APP_ID }}
                  NEXT_PUBLIC_SAFARI_WEB_ID=${{ vars.NEXT_PUBLIC_SAFARI_WEB_ID }}
                  NEXT_PUBLIC_ONESIGNAL_WEBHOOK=${{ vars.NEXT_PUBLIC_ONESIGNAL_WEBHOOK }}
                  EOF

            - name: Build native static export
              run: node scripts/native-build.js

            - name: Verify build output
              run: |
                  test -d out && test -f out/index.html || (echo "ERROR: out/ directory missing or incomplete" && exit 1)
                  echo "Bundle ready. File count: $(find out -type f | wc -l)"

            - name: Determine channel
              id: channel
              run: |
                  # Keep in lockstep with the `environment:` expression above — a ref
                  # that resolves to production here but is missing there would ship to
                  # every device with nobody approving it.
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "name=${{ github.event.inputs.channel }}" >> $GITHUB_OUTPUT
                  elif [ "$GITHUB_REF_TYPE" = "tag" ] && case "$GITHUB_REF_NAME" in ota-*) true;; *) false;; esac; then
                    echo "name=production" >> $GITHUB_OUTPUT
                  else
                    echo "name=staging" >> $GITHUB_OUTPUT
                  fi

            - name: Upload bundle to Capgo
              # Commit message via env, never inline — a multi-line message (or one
              # with quotes) injected into the run script breaks --comment quoting.
              env:
                  CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
                  # Private E2E signing key (PEM contents of .capgo_key_v2). Its
                  # public half is baked into capacitor.config.ts, so the app only
                  # accepts bundles signed here.
                  CAPGO_PRIVATE_KEY: ${{ secrets.CAPGO_PRIVATE_KEY }}
                  COMMIT_MSG: ${{ github.event.head_commit.message }}
                  CHANNEL: ${{ steps.channel.outputs.name }}
              run: |
                  # Capgo defaults the bundle version to package.json's, so a lane that
                  # ships on every merge collides the moment two merges share a version
                  # ("Version x already exists"). That silently killed dev -> staging:
                  # dev sat on 1.0.8 and every deploy after the first failed, which
                  # looks identical to no deploy at all.
                  #
                  # Production takes its version from the ota-* tag, so the bundle is
                  # named by the tag that shipped it and re-shipping the same JS on the
                  # same native build just needs a new tag (ota-1.0.48-hotfix1) rather
                  # than a package.json bump. Everything else is a continuous lane and
                  # gets the short SHA appended to stay unique.
                  if [ "$CHANNEL" = "production" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
                      VERSION="${GITHUB_REF_NAME#ota-}"
                  else
                      VERSION="$(node -p "require('./package.json').version")"
                      if [ "$CHANNEL" != "production" ]; then
                          VERSION="$VERSION-${GITHUB_SHA:0:7}"
                      fi
                  fi
                  echo "Uploading bundle $VERSION to channel $CHANNEL"
                  COMMENT="${GITHUB_SHA:0:7} — $(printf '%s' "${COMMIT_MSG:-Manual deploy}" | head -n1)"
                  npx @capgo/cli@latest bundle upload \
                    --channel "$CHANNEL" \
                    --apikey "$CAPGO_API_KEY" \
                    --key-data-v2 "$CAPGO_PRIVATE_KEY" \
                    --path ./out \
                    --bundle "$VERSION" \
                    --auto-min-update-version \
                    --version-exists-ok \
                    --comment "$COMMENT"

            - name: Deployment summary
              run: |
                  echo "## OTA Deployment" >> $GITHUB_STEP_SUMMARY
                  echo "- **Channel:** ${{ steps.channel.outputs.name }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
