name: Deploy OTA Update (Capgo)

on:
    # Production OTA reaches every shipped iOS and Android install, so it is opt-in
    # per release and never a side effect of pushing code. Normally this workflow is
    # called by release-ota.yml, which resolves the bundle version and tags the
    # commit afterwards; `dev` still auto-ships to staging, which reaches no
    # production device.
    #
    # One deliberate exception: a NATIVE release whose versionName is ahead of the
    # newest production bundle auto-publishes a matching bundle from its own commit
    # (see android-release.yml / ios-release.yml). Without that, Capgo's
    # disable_auto_update_under_native rule makes every device on the new binary
    # refuse all existing bundles — OTA silently dead for the fleet while CI stays
    # green (TASK-21793).
    #
    # An `ota-*` tag push stays as a break-glass path, naming its own bundle
    # (ota-1.1.4 -> 1.1.4) and validated against the release scheme. Deliberately
    # NOT `v*`: ios-release.yml and android-release.yml claim that prefix for native
    # store builds, and a JS-only OTA must not be able to trigger those.
    #
    # NOTE: running the workflow is currently the only approval step. The job
    # declares the Production environment below, but that environment has no
    # protection rules (verified 2026-08-06 via `gh api repos/:owner/:repo/environments`),
    # so it gates nothing yet — adding required reviewers there makes a production
    # deploy queue for a second human, with no change to this file.
    workflow_call:
        inputs:
            channel:
                description: 'Capgo channel to deploy to'
                required: true
                type: string
            version:
                description: 'Resolved bundle version to upload'
                required: true
                type: string
    push:
        branches: [dev]
        tags: ['ota-*']
    workflow_dispatch:
        inputs:
            channel:
                description: 'Capgo channel to deploy to'
                required: true
                default: 'production'
                type: choice
                options:
                    - development
                    - staging
                    - production

permissions:
    contents: read

concurrency:
    group: capgo-deploy-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        # Scope the Production environment to production deploys only, so the
        # dev→staging auto-push is never paused. NOTE: this environment has no
        # protection rules today, so declaring it gates nothing — see the warning at
        # the top of this file. It is wired up so that adding required reviewers in
        # Settings → Environments → Production takes effect without touching CI.
        #
        # Must be an expression over the event, not the resolved channel below: GitHub
        # picks the environment before any step runs, so it cannot read a step output.
        # Keep the two in sync — every branch that resolves to `production` needs to
        # appear here, or its deploy would reach all users with no approval.
        environment: >-
            ${{ (inputs.channel == 'production'
            || startsWith(github.ref, 'refs/tags/ota-')) && 'Production' || '' }}
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}
                  # Full history: the bundle version's patch is the commit count.
                  fetch-depth: 0

            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

            - uses: actions/setup-node@v6
              with:
                  node-version: '20'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - name: Build native static export
              run: node scripts/native-build.js

            - name: Verify build output
              run: |
                  test -d out && test -f out/index.html || (echo "ERROR: out/ directory missing or incomplete" && exit 1)
                  echo "Bundle ready. File count: $(find out -type f | wc -l)"

            - name: Determine channel
              id: channel
              run: |
                  # Keep in lockstep with the `environment:` expression above — a ref
                  # that resolves to production here but is missing there would ship to
                  # every device with nobody approving it.
                  if [ -n "${{ inputs.channel }}" ]; then
                    echo "name=${{ inputs.channel }}" >> $GITHUB_OUTPUT
                  elif [ "$GITHUB_REF_TYPE" = "tag" ] && case "$GITHUB_REF_NAME" in ota-*) true;; *) false;; esac; then
                    echo "name=production" >> $GITHUB_OUTPUT
                  else
                    echo "name=staging" >> $GITHUB_OUTPUT
                  fi

            - name: Resolve bundle version
              id: version
              env:
                  CHANNEL: ${{ steps.channel.outputs.name }}
                  INPUT_VERSION: ${{ inputs.version || '' }}
              run: |
                  # release-ota.yml resolves the production version off the channel's
                  # current bundle and passes it here, so the input wins. A break-glass
                  # `ota-*` tag still names its own bundle, validated against the
                  # release scheme so an off-scheme tag cannot ship.
                  #
                  # Every other lane derives <major>.<build>.<commit count>. The commit
                  # count is what keeps staging out of production's way: the two share
                  # one bundle namespace, production counts OTAs in single digits, and a
                  # version collision no-ops under --version-exists-ok — uploaded,
                  # listed, shipped to nobody. A short-SHA suffix would look equivalent
                  # and is not: 1.1.0-abc1234 is a semver prerelease, sorts BELOW plain
                  # 1.1.0, and Capgo's disable_auto_update_under_native makes every
                  # device on the 1.1.0 binary refuse it.
                  if [ -n "$INPUT_VERSION" ]; then
                      VERSION="$INPUT_VERSION"
                  elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
                      VERSION="${GITHUB_REF_NAME#ota-}"
                      node scripts/release-version.mjs validate "$VERSION" --kind ota
                  elif [ "$CHANNEL" = "production" ]; then
                      # A bare dispatch to production would land a staging-shaped
                      # version on the production channel and drag its OTA counter into
                      # the commit-count band, where the next resolved version collides
                      # with a bundle that already exists.
                      echo "::error::a production deploy needs a resolved version — use the Release OTA workflow" >&2
                      exit 1
                  else
                      VERSION="$(node scripts/release-version.mjs staging)"
                  fi
                  echo "name=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Uploading as bundle version $VERSION"

            - name: Upload bundle to Capgo
              # Commit message via env, never inline — a multi-line message (or one
              # with quotes) injected into the run script breaks --comment quoting.
              env:
                  CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
                  # Private E2E signing key (PEM contents of .capgo_key_v2). Its
                  # public half is baked into capacitor.config.ts, so the app only
                  # accepts bundles signed here.
                  CAPGO_PRIVATE_KEY: ${{ secrets.CAPGO_PRIVATE_KEY }}
                  COMMIT_MSG: ${{ github.event.head_commit.message }}
                  CHANNEL: ${{ steps.channel.outputs.name }}
                  VERSION: ${{ steps.version.outputs.name }}
              run: |
                  echo "Uploading bundle $VERSION to channel $CHANNEL"
                  COMMENT="${GITHUB_SHA:0:7} — $(printf '%s' "${COMMIT_MSG:-Manual deploy}" | head -n1)"
                  npx @capgo/cli@latest bundle upload \
                    --channel "$CHANNEL" \
                    --apikey "$CAPGO_API_KEY" \
                    --key-data-v2 "$CAPGO_PRIVATE_KEY" \
                    --path ./out \
                    --bundle "$VERSION" \
                    --auto-min-update-version \
                    --version-exists-ok \
                    --comment "$COMMENT"

            # --version-exists-ok turns "this version is already uploaded" into a
            # silent no-op, which is what we want for a re-run of the same commit
            # and never what we want otherwise. Assert the channel really serves
            # the version this run built, so a no-op that ships nothing is red.
            - name: Verify channel serves the new bundle
              env:
                  CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
                  CHANNEL: ${{ steps.channel.outputs.name }}
                  EXPECTED: ${{ steps.version.outputs.name }}
              run: |
                  CURRENT="$(npx @capgo/cli@latest channel currentBundle "$CHANNEL" \
                    --apikey "$CAPGO_API_KEY" --quiet | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' | tail -n1 || true)"
                  if [ "$CURRENT" != "$EXPECTED" ]; then
                    echo "ERROR: channel $CHANNEL serves '${CURRENT:-<none>}', expected $EXPECTED — nothing shipped" >&2
                    exit 1
                  fi
                  echo "Channel $CHANNEL now serves $EXPECTED"

            - name: Deployment summary
              run: |
                  echo "## OTA Deployment" >> $GITHUB_STEP_SUMMARY
                  echo "- **Channel:** ${{ steps.channel.outputs.name }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Bundle version:** ${{ steps.version.outputs.name }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
