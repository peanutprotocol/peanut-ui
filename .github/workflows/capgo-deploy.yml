name: Deploy OTA Update (Capgo)

on:
    # `dev` auto-ships to staging. `mobile-release` is the native release branch, so
    # it targets the production channel — the one every shipped iOS and Android
    # install actually listens on, which is the point: an OTA there reaches all
    # users, not a tester subset.
    #
    # Reaching production still requires a human. Every production deploy runs under
    # the Production environment's required reviewers, whether it arrives by push or
    # by dispatch, so no commit can push OTA JS to devices unapproved.
    push:
        branches: [dev, mobile-release]
    workflow_dispatch:
        inputs:
            channel:
                description: 'Capgo channel to deploy to'
                required: true
                default: 'production'
                type: choice
                options:
                    - development
                    - staging
                    - production

permissions:
    contents: read

concurrency:
    group: capgo-deploy-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        # Gate ONLY the production deploy behind the Production environment (required
        # reviewers, set in repo Settings → Environments → Production). Resolving to an
        # empty string means no environment, so the dev→staging auto-push is never
        # paused for approval.
        #
        # Must be an expression over the event, not the resolved channel below: GitHub
        # picks the environment before any step runs, so it cannot read a step output.
        # Keep the two in sync — every branch that resolves to `production` needs to
        # appear here, or its deploy would reach all users with no approval.
        environment: >-
            ${{ ((github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'production')
            || github.ref == 'refs/heads/main'
            || github.ref == 'refs/heads/mobile-release') && 'Production' || '' }}
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}

            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

            - uses: actions/setup-node@v6
              with:
                  node-version: '20'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - name: Build native static export
              run: node scripts/native-build.js

            - name: Verify build output
              run: |
                  test -d out && test -f out/index.html || (echo "ERROR: out/ directory missing or incomplete" && exit 1)
                  echo "Bundle ready. File count: $(find out -type f | wc -l)"

            - name: Determine channel
              id: channel
              run: |
                  # Keep in lockstep with the `environment:` expression above — a
                  # branch that resolves to production here but is missing there would
                  # ship to every device with nobody approving it.
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "name=${{ github.event.inputs.channel }}" >> $GITHUB_OUTPUT
                  elif [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/mobile-release" ]; then
                    echo "name=production" >> $GITHUB_OUTPUT
                  else
                    echo "name=staging" >> $GITHUB_OUTPUT
                  fi

            - name: Upload bundle to Capgo
              # Commit message via env, never inline — a multi-line message (or one
              # with quotes) injected into the run script breaks --comment quoting.
              env:
                  CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
                  # Private E2E signing key (PEM contents of .capgo_key_v2). Its
                  # public half is baked into capacitor.config.ts, so the app only
                  # accepts bundles signed here.
                  CAPGO_PRIVATE_KEY: ${{ secrets.CAPGO_PRIVATE_KEY }}
                  COMMIT_MSG: ${{ github.event.head_commit.message }}
                  CHANNEL: ${{ steps.channel.outputs.name }}
              run: |
                  # Capgo defaults the bundle version to package.json's, so a lane that
                  # ships on every merge collides the moment two merges share a version
                  # ("Version x already exists"). That silently killed dev -> staging:
                  # dev sat on 1.0.8 and every deploy after the first failed, which
                  # looks identical to no deploy at all.
                  #
                  # Continuous lanes therefore get the short SHA appended, the same way
                  # the preview lane does. Production deliberately does not: shipping
                  # there should be a decision tied to a real version, so a collision
                  # is the correct answer and means "bump package.json first".
                  VERSION="$(node -p "require('./package.json').version")"
                  if [ "$CHANNEL" != "production" ]; then
                      VERSION="$VERSION-${GITHUB_SHA:0:7}"
                  fi
                  echo "Uploading bundle $VERSION to channel $CHANNEL"
                  COMMENT="${GITHUB_SHA:0:7} — $(printf '%s' "${COMMIT_MSG:-Manual deploy}" | head -n1)"
                  npx @capgo/cli@latest bundle upload \
                    --channel "$CHANNEL" \
                    --apikey "$CAPGO_API_KEY" \
                    --key-data-v2 "$CAPGO_PRIVATE_KEY" \
                    --path ./out \
                    --bundle "$VERSION" \
                    --auto-min-update-version \
                    --comment "$COMMENT"

            - name: Deployment summary
              run: |
                  echo "## OTA Deployment" >> $GITHUB_STEP_SUMMARY
                  echo "- **Channel:** ${{ steps.channel.outputs.name }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
