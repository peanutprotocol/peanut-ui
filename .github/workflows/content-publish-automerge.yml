name: Content publish auto-merge

# Auto-approve + auto-merge content-only submodule bumps to `main` (production
# content publishes, e.g. #2400). Everything else keeps the normal gate:
# 1 human review + green `ci-success` (the "Protect Prod" org ruleset).
#
# Why this exists: "Protect Prod" requires 1 approving review on EVERY PR to
# main — GitHub rulesets can't make that conditional on the changed paths. A
# content publish PR is a single `src/content` gitlink bump: safe by inspection
# and shouldn't need a second human. This workflow supplies the approval ONLY
# when the diff is exactly that pointer, so the review requirement stays fully
# in force for real code. eslint is in `ci-success`, so "green tests" here
# includes lint — a lint error on `main` stalls content publishes too.
#
# TWO PATHS TO MERGE, because the approver can't always approve:
#
#   1. `approve-and-merge` (pull_request_target) — approve, then `--auto --merge`.
#      GitHub enforces `ci-success` before auto-merge fires. This is the path for
#      any publish authored by someone other than CONTENT_BOT_TOKEN's user.
#
#   2. `merge-on-green` (workflow_run) — for publishes that CONTENT_BOT_TOKEN's
#      own user authored, where GitHub forbids self-approval so path 1 can never
#      complete. Since `update-content.yml` now opens its PRs as that user, this
#      is the common path, not the exception. It merges via the org-admin bypass,
#      which skips the review requirement (intended — the diff guard replaces it)
#      AND the required status check (NOT intended). So this job re-establishes
#      green `ci-success` ITSELF before merging. Never merge on the bypass alone.
#
# Security model:
#   - `pull_request_target` and `workflow_run` both run THIS logic from the
#     default branch (main), so a PR cannot tamper with the guard or the merge
#     step. We never check out or run PR code — only `gh` API calls by PR number
#     — so both triggers are safe here (no untrusted-code execution).
#   - Same-repo branches only (fork guards on both jobs).
#   - Both paths require the diff to be EXACTLY `src/content` and are fail-closed:
#     any extra file, any `gh` error, any missing check → no merge.

on:
    pull_request_target:
        types: [opened, synchronize, reopened, ready_for_review]
        branches: [main]
    workflow_run:
        workflows: ['Tests']
        types: [completed]

permissions:
    contents: read
    pull-requests: write

jobs:
    approve-and-merge:
        # Read CONTENT_BOT_TOKEN from the `content-publish` environment, whose
        # deployment branch policy allows `main` only. The token is an org admin
        # (it needs the bypass to merge), and a dozen workflows in this repo carry
        # `workflow_dispatch`, which runs a workflow FROM THE DISPATCHED REF. As a
        # plain repo secret it was therefore readable by anyone with write access:
        # push a branch with a workflow that echoes it, dispatch that branch, done.
        # Scoped to the environment it is unreachable from any ref but `main`.
        environment: content-publish
        # Same-repo PRs only — never a fork.
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - name: Guard — diff must be exactly the content submodule pointer
              id: guard
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR: ${{ github.event.pull_request.number }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  # `gh pr diff` returns HTTP 406 after 300 files. The Files API
                  # is paginated, so large code PRs reach the same fail-closed
                  # exact-match decision instead of leaving a false-red check.
                  FILES=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
                  echo "Changed files:"
                  echo "$FILES"
                  if [ "$FILES" = "src/content" ]; then
                    echo "content_only=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "content_only=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::Not content-only — normal review gate stays in place."
                  fi

            - name: Approve + enable auto-merge
              if: steps.guard.outputs.content_only == 'true'
              env:
                  GH_TOKEN: ${{ secrets.CONTENT_BOT_TOKEN }}
                  PR: ${{ github.event.pull_request.number }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  # Approve — satisfies the 1-review rule. Fails when the bot user
                  # authored the PR (GitHub blocks self-approval); `merge-on-green`
                  # picks those up once CI is green.
                  if gh pr review "$PR" --repo "$REPO" --approve; then
                    # main ruleset allows merge commits only (not squash/rebase).
                    gh pr merge "$PR" --repo "$REPO" --auto --merge \
                      || echo "::warning::auto-merge not enabled/permitted — merge manually."
                  else
                    echo "::notice::Could not approve (bot authored this PR) — merge-on-green will handle it once ci-success is green."
                  fi

    merge-on-green:
        # Read CONTENT_BOT_TOKEN from the `content-publish` environment, whose
        # deployment branch policy allows `main` only. The token is an org admin
        # (it needs the bypass to merge), and a dozen workflows in this repo carry
        # `workflow_dispatch`, which runs a workflow FROM THE DISPATCHED REF. As a
        # plain repo secret it was therefore readable by anyone with write access:
        # push a branch with a workflow that echoes it, dispatch that branch, done.
        # Scoped to the environment it is unreachable from any ref but `main`.
        environment: content-publish
        # Self-approval fallback. Fires when `Tests` finishes for any commit; the
        # job itself works out whether there's a content publish to merge.
        if: github.event_name == 'workflow_run'
        runs-on: ubuntu-latest
        steps:
            - name: Merge content-only publishes once ci-success is green
              env:
                  GH_TOKEN: ${{ secrets.CONTENT_BOT_TOKEN }}
                  SHA: ${{ github.event.workflow_run.head_sha }}
                  REPO: ${{ github.repository }}
              run: |
                  set -uo pipefail
                  # `set +e` deliberately. GitHub runs this as `bash -e {0}`, so any
                  # unguarded non-zero — a transient `gh` 5xx, a PR that closed between
                  # the list and the diff — kills the step mid-loop with no output and
                  # a bare red run. Every branch below checks its own inputs and says
                  # what it decided; dying silently is strictly worse than continuing.
                  set +e

                  # Key off the `ci-success` check run, NOT `workflow_run.conclusion`.
                  # `ci-success` is the single check the "Protect Prod" ruleset gates
                  # on; the run conclusion also folds in advisory jobs (e2e). Gate on
                  # exactly what the ruleset gates on.
                  #
                  # `Tests` runs on `pull_request` (and `push` for dev/main), so a
                  # commit can carry more than one ci-success check run. Require at
                  # least one and ALL of them green — a single red run must block the
                  # merge.
                  RUNS="repos/$REPO/commits/$SHA/check-runs?per_page=100"
                  TOTAL=$(gh api "$RUNS" --jq '[.check_runs[] | select(.name=="ci-success")] | length' || echo 0)
                  GREEN=$(gh api "$RUNS" --jq '[.check_runs[] | select(.name=="ci-success" and .conclusion=="success")] | length' || echo 0)
                  # On failure `gh` prints its JSON error body to stdout, which lands
                  # in these vars. Without this, `[ "$TOTAL" -eq 0 ]` errors out and the
                  # loop below iterates over the error text as if the words were PR
                  # numbers. Anything non-numeric means "we don't know" -> don't merge.
                  case "$TOTAL" in '' | *[!0-9]*) TOTAL=0 ;; esac
                  case "$GREEN" in '' | *[!0-9]*) GREEN=-1 ;; esac

                  if [ "$TOTAL" -eq 0 ] || [ "$TOTAL" -ne "$GREEN" ]; then
                    echo "ci-success not green for $SHA ($GREEN/$TOTAL) — nothing to merge."
                    exit 0
                  fi

                  # Open, non-draft, same-repo PRs into main still sitting on this exact
                  # commit. The head.sha match stops us merging a PR that has since
                  # moved on to an untested commit.
                  PRS=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq "
                    .[]
                    | select(.state == \"open\")
                    | select(.draft == false)
                    | select(.base.ref == \"main\")
                    | select(.head.repo.full_name == \"$REPO\")
                    | select(.head.sha == \"$SHA\")
                    | .number")

                  if [ -z "$PRS" ]; then
                    echo "No open content-publish candidates on $SHA."
                    exit 0
                  fi

                  for PR in $PRS; do
                    # Same reason: never treat a fragment of an error body as a PR number.
                    case "$PR" in '' | *[!0-9]*) echo "::warning::ignoring non-numeric PR id '$PR'"; continue ;; esac
                    FILES=$(gh pr diff "$PR" --repo "$REPO" --name-only || echo UNKNOWN)
                    if [ "$FILES" != "src/content" ]; then
                      echo "::notice::#$PR is not content-only — normal review gate stays in place."
                      continue
                    fi
                    echo "Merging #$PR — diff is exactly src/content, ci-success green ($GREEN/$TOTAL) on $SHA."
                    # `--admin` is required, not optional. Being an OrganizationAdmin
                    # does NOT make `gh pr merge` bypass "Protect Prod" — gh enforces
                    # the branch policy and tells you to pass --admin explicitly.
                    # Without it every merge here fails with "the base branch policy
                    # prohibits the merge", which is exactly what happened to #2547.
                    #
                    # --admin also skips the required status check, so note what it is
                    # NOT skipping: this job has already established, itself, that the
                    # diff is exactly src/content and that every ci-success run on this
                    # commit is green. The gate is enforced above, in code, before we
                    # get here — --admin only waives the human review, which is the
                    # whole point of this workflow.
                    if ! MERGE_ERR=$(gh pr merge "$PR" --repo "$REPO" --merge --admin 2>&1); then
                      # A merge we decided to make and then failed to make is the exact
                      # silent failure this pipeline exists to prevent. Be loud.
                      echo "::error::MERGE FAILED for #$PR — content will NOT reach production. $MERGE_ERR"
                      FAILED=1
                    fi
                  done

                  if [ "${FAILED:-0}" = "1" ]; then
                    echo "At least one content publish could not be merged (see errors above)."
                    exit 1
                  fi
