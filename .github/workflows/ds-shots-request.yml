# issue_comment is resolved from main. Never check out or execute PR code here:
# this job has actions:write only to dispatch the read-only capture workflow.
name: Request ds-shots

on:
    issue_comment:
        types: [created]

permissions: {}

jobs:
    request:
        if: >-
            github.event.issue.pull_request &&
            github.event.comment.body == '/ds-shots' &&
            github.event.comment.user.type == 'User'
        runs-on: ubuntu-latest
        timeout-minutes: 2
        permissions:
            actions: write
            contents: read
            pull-requests: read
        steps:
            - name: Authorize and dispatch the current PR head
              uses: actions/github-script@v7
              with:
                  script: |
                      if (context.payload.comment.body !== '/ds-shots') return
                      const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
                          ...context.repo, username: context.payload.comment.user.login,
                      })
                      if (!['write', 'maintain', 'admin'].includes(access.permission)) {
                          core.notice('Only collaborators with repository write access can request ds-shots')
                          return
                      }
                      const { data: pr } = await github.rest.pulls.get({
                          ...context.repo, pull_number: context.issue.number,
                      })
                      if (pr.state !== 'open' || pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                          core.notice('Only open same-repository PRs can be captured')
                          return
                      }
                      await github.rest.actions.createWorkflowDispatch({
                          ...context.repo,
                          workflow_id: 'ds-shots.yml',
                          ref: pr.head.ref,
                          inputs: { pr_number: String(pr.number), expected_head: pr.head.sha },
                      })
                      core.notice(`Requested ds-shots for PR #${pr.number} at ${pr.head.sha}`)
