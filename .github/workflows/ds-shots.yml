# The comment bridge dispatches this workflow at the PR branch, so workflow_run
# carries the tested head SHA/ref and the existing publisher can verify it.
# All jobs are read-only; publishing remains in ds-shots-comment.yml on main.
name: ds-shots

on:
    workflow_dispatch:
        inputs:
            pr_number:
                description: Open same-repository PR to compare
                required: true
                type: string
            expected_head:
                description: Optional head SHA to reject a race after the comment
                required: false
                type: string

permissions:
    contents: read

concurrency:
    group: ds-shots-manual-${{ inputs.pr_number }}
    cancel-in-progress: true

jobs:
    prepare:
        runs-on: ubuntu-latest
        timeout-minutes: 2
        permissions:
            contents: read
            pull-requests: read
        outputs:
            head: ${{ steps.pr.outputs.head }}
            base: ${{ steps.pr.outputs.base }}
        steps:
            - uses: actions/github-script@v7
              id: pr
              env:
                  PR_NUMBER: ${{ inputs.pr_number }}
                  EXPECTED_HEAD: ${{ inputs.expected_head }}
              with:
                  script: |
                      const number = process.env.PR_NUMBER
                      if (!/^[1-9][0-9]*$/.test(number)) throw new Error('Invalid PR number')
                      const { data: pr } = await github.rest.pulls.get({
                          ...context.repo, pull_number: Number(number),
                      })
                      if (pr.state !== 'open' || pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                          throw new Error('Only open same-repository PRs can be captured')
                      }
                      if (pr.head.sha !== context.sha || `refs/heads/${pr.head.ref}` !== context.ref) {
                          throw new Error('Run this workflow from the PR head branch at its current commit')
                      }
                      if (process.env.EXPECTED_HEAD && process.env.EXPECTED_HEAD !== pr.head.sha) {
                          throw new Error('The PR changed after the request; post /ds-shots again')
                      }
                      core.setOutput('head', pr.head.sha)
                      core.setOutput('base', pr.base.sha)

    backdoor-scan:
        needs: prepare
        uses: ./.github/workflows/backdoor-scan.yml
        secrets:
            TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

    capture:
        needs: [prepare, backdoor-scan]
        runs-on: ubuntu-latest
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include:
                    - side: base
                      sha: ${{ needs.prepare.outputs.base }}
                    - side: head
                      sha: ${{ needs.prepare.outputs.head }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ matrix.sha }}
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}
                  # Build code must not retain the submodule credential.
                  persist-credentials: false

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'pnpm'

            - run: pnpm install --frozen-lockfile

            # Browser cache, moved here verbatim from the deleted `e2e` job. The
            # download is the step that hangs, so the cheapest fix is to not do
            # it on most runs. Keyed on the Playwright version, because browser
            # builds are pinned to it.
            - name: Resolve Playwright version
              id: pw
              run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              id: pw-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

            - name: Install Playwright browsers
              if: steps.pw-cache.outputs.cache-hit != 'true'
              timeout-minutes: 6
              run: npx playwright install --with-deps chromium

            # The cache holds browsers, not the apt packages they link against,
            # so system deps still need installing on a cache hit.
            #
            # `apt-get update` inside install-deps stalls intermittently on the
            # runner's Azure mirrors: three consecutive 6-minute timeouts on
            # 2026-08-19 (PR #2755), all of them ignoring
            # azure.archive.ubuntu.com and then hanging on noble-security, while
            # sibling runs minutes apart cleared the same step in seconds. The
            # stall is transient, so retry with a per-attempt cap — one bad
            # mirror then costs an attempt instead of the whole job — and drop
            # to the canonical archive after the first failure. `timeout` owns
            # the attempt's process group, so --kill-after reaps an apt child
            # that ignores the SIGTERM it sends first. Still exits
            # non-zero once the attempts are spent: a genuinely missing system
            # library must stay a red job, not a silent one.
            - name: Install Playwright system deps
              if: steps.pw-cache.outputs.cache-hit == 'true'
              timeout-minutes: 9
              run: |
                  for attempt in 1 2 3; do
                      if timeout --kill-after=15s 150 npx playwright install-deps chromium; then
                          exit 0
                      fi
                      echo "::warning::playwright install-deps attempt ${attempt} failed or stalled; retrying"
                      sudo rm -rf /var/lib/apt/lists/partial/* || true
                      if [ "${attempt}" = 1 ]; then
                          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
                              /etc/apt/sources.list.d/*.sources /etc/apt/sources.list || true
                      fi
                      sleep 5
                  done
                  echo "::error::playwright install-deps failed after 3 attempts"
                  exit 1

            # Reuse existing build caches without writing a cache per request.
            - name: Restore the Next build cache
              uses: actions/cache/restore@v4
              with:
                  path: .next/cache
                  key: ds-shots-next-v4-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'next.config.*', '.github/workflows/tests.yml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx') }}
                  restore-keys: |
                      ds-shots-next-v4-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'next.config.*', '.github/workflows/tests.yml') }}-

            - name: Build
              env:
                  # Without this DEV_TOOLS_ENABLED is false, ?__fixture= is
                  # ignored, and every screen redirects to /setup. It is a
                  # NEXT_PUBLIC_ value, so it must be set on the build, not on
                  # the capture — Next inlines it into the bundle here.
                  NEXT_PUBLIC_VERCEL_ENV: preview
                  # BASE_URL falls back to https://peanut.me when unset, which
                  # flips the dev layout's prod gate and notFound()s every
                  # /dev page the regression specs drive. Locally .env sets
                  # it; CI has no .env, so set it here.
                  NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3080
                  # Match the screen-library build: restored Webpack hashes crash WasmHash.
                  SCREEN_CAPTURE_BUILD: '1'
                  # Fonts from the repo, not Google Fonts: see scripts/next-font-google/mock.cjs.
                  NEXT_FONT_GOOGLE_MOCKED_RESPONSES: ${{ github.workspace }}/scripts/next-font-google/mock.cjs
              run: pnpm build

            # Capture both sides at the same widths. No automatic dev baseline
            # is needed, and the report records the exact base commit used.
            - name: Capture screenshots
              env:
                  SHOTS_OUT: e2e/__shots__/${{ matrix.side }}
              run: pnpm test:visual:capture --project=320 --project=430

            - name: Upload capture
              uses: actions/upload-artifact@v4
              with:
                  name: ds-shots-${{ matrix.side }}-${{ github.run_attempt }}
                  path: e2e/__shots__/${{ matrix.side }}
                  if-no-files-found: error
                  retention-days: 7

            - name: Run regression specs on the PR head
              if: matrix.side == 'head'
              run: pnpm test:e2e:regression

            - name: i18n overflow gate on the PR head
              if: matrix.side == 'head'
              run: pnpm test:i18n-overflow:run

            - name: Upload regression artifacts on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: regression-results-${{ matrix.side }}-${{ github.run_attempt }}
                  path: e2e/__results__/
                  retention-days: 7

    diff:
        needs: [prepare, backdoor-scan, capture]
        # A regression failure still leaves useful captures to compare.
        if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.backdoor-scan.result == 'success' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.prepare.outputs.head }}
                  persist-credentials: false
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
            - uses: actions/download-artifact@v4
              with:
                  name: ds-shots-base-${{ github.run_attempt }}
                  path: e2e/__shots__/base
            - uses: actions/download-artifact@v4
              with:
                  name: ds-shots-head-${{ github.run_attempt }}
                  path: e2e/__shots__/head
            - name: Compare the exact base and head captures
              env:
                  BASELINE: ${{ needs.prepare.outputs.base }}
                  HEAD_SHA: ${{ needs.prepare.outputs.head }}
              run: |
                  set -euo pipefail
                  node scripts/visual-diff.mjs e2e/__shots__/base e2e/__shots__/head \
                      --out=e2e/__shots__/diff --json > e2e/__shots__/report.json
                  node -e '
                      const fs = require("node:fs")
                      const p = "e2e/__shots__/report.json"
                      const r = JSON.parse(fs.readFileSync(p, "utf8"))
                      r.baseline = process.env.BASELINE
                      fs.writeFileSync(p, JSON.stringify(r, null, 2))
                  '
                  node scripts/visual-comment.mjs e2e/__shots__/report.json \
                      --baseline="$BASELINE" --head="$HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
            - name: Upload the changed screenshots
              uses: actions/upload-artifact@v4
              with:
                  name: visual-diff-${{ inputs.pr_number }}-${{ github.run_attempt }}
                  path: |
                      e2e/__shots__/base
                      e2e/__shots__/head
                      e2e/__shots__/diff
                  retention-days: 7
            - name: Upload the diff report
              uses: actions/upload-artifact@v4
              with:
                  name: visual-diff-report-${{ inputs.pr_number }}-${{ github.run_attempt }}
                  path: e2e/__shots__/report.json
                  if-no-files-found: error
                  retention-days: 7
