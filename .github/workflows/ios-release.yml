name: iOS Release (TestFlight)

# Builds a SIGNED iOS app and uploads it to TestFlight.
# Mirrors android-release.yml's no-fastlane style: signing material lives as CI
# secrets (base64 .p12 cert + base64 provisioning profile, the iOS analogue of the
# Android keystore-as-secret), the build is reproducible, and the IPA lands on
# TestFlight for manual App Store promotion. No Ruby/fastlane toolchain.
#
# Trigger: normally called by release-native.yml, which resolves the version so
#          nobody types one. A `vX.Y.Z` tag push and a manual dispatch stay as
#          break-glass paths; both validate the version against the release scheme
#          (`v*` is too loose a glob to reject a tag like v2026.02.26 on its own).
# Prereq: the `ios/` Capacitor platform must be committed on the branch CI builds
#         (currently only present in the peanut-ui-ios2 worktree).
#
# Required repo secrets (see docs/NATIVE-RELEASE.md §11):
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_CONTENT   App Store Connect API key (.p8 PEM contents)
#   APPLE_TEAM_ID                                  Apple Developer team id
#   IOS_DIST_CERT_P12_BASE64 / IOS_DIST_CERT_PASSWORD   Apple Distribution cert (.p12, base64) + its password
#   IOS_PROVISIONING_PROFILE_BASE64                App Store provisioning profile (.mobileprovision, base64)
#   SUBMODULE_TOKEN                                read access to the src/content submodule
# Plus the production NEXT_PUBLIC_* the static export bakes in (see the env step).

on:
    workflow_call:
        inputs:
            versionName:
                description: 'Resolved <major>.<build>.0 version to ship'
                required: true
                type: string
            pushDebug:
                description: 'Enable OneSignal verbose logging in this build'
                required: false
                default: false
                type: boolean
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            versionName:
                description: 'Break-glass <major>.<build>.0 version (required; there is no package.json fallback)'
                required: false
                type: string
            pushDebug:
                description: 'Enable OneSignal verbose logging in this build'
                required: false
                default: false
                type: boolean

permissions:
    contents: read

concurrency:
    # A break-glass `v*` tag push runs outside release-native.yml's mutex, so it joins
    # `production-release` here (which serialises iOS and Android for that path only —
    # the price of not racing a concurrent OTA). When release-native.yml calls this
    # workflow the parent already holds the mutex, and github.event_name is the
    # caller's `workflow_dispatch`, so the called run keeps its own group instead of
    # deadlocking against its parent. A direct dispatch of this workflow is
    # indistinguishable from that, so it sits outside the mutex — deepest break-glass.
    group: >-
        ${{ github.event_name == 'push' && 'production-release'
        || format('ios-release-{0}', github.ref) }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: macos-15
        # Protect with required reviewers in repo Settings → Environments → Production.
        environment: Production
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: recursive
                  token: ${{ secrets.SUBMODULE_TOKEN }}

            - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
              with:
                  xcode-version: latest-stable

            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

            - uses: actions/setup-node@v6
              with:
                  node-version: '22' # @sentry/profiling-node has no Node 25 binary; project targets 22
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - name: Resolve release versionName
              id: version
              env:
                  INPUT_VERSION: ${{ inputs.versionName || '' }}
              run: |
                  # release-native.yml resolves the version and passes it here, so the
                  # input wins; a break-glass tag push falls back to the tag name minus
                  # its leading 'v' (v1.1.0 -> 1.1.0). Either way it is validated
                  # against the release scheme before a 30-minute build starts, which is
                  # what stops an off-scheme tag (v2026.02.26 is on main) from shipping
                  # a binary the OTA lane can never sort above. Resolved once, up front,
                  # so the OTA floor check and the bundle publish below see the exact
                  # version the binary ships with. Keep in lockstep with
                  # android-release.yml.
                  VERSION_NAME="$INPUT_VERSION"
                  if [ -z "$VERSION_NAME" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
                      VERSION_NAME="${GITHUB_REF_NAME#v}"
                  fi
                  if [ -z "$VERSION_NAME" ]; then
                      echo "::error::no versionName — call this from release-native.yml, or push a vX.Y.0 tag" >&2
                      exit 1
                  fi
                  node scripts/release-version.mjs validate "$VERSION_NAME" --kind native
                  echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
                  echo "Release versionName: $VERSION_NAME"

            # A binary whose versionName is ahead of the newest production OTA bundle
            # makes Capgo's disable_auto_update_under_native rule reject every bundle
            # on those devices — OTA goes silently dead for the whole fleet while CI
            # stays green (TASK-21793: 102 devices, a month of refused updates). Read
            # the floor before the long build; the publish step after the store
            # upload closes the gap this detects. Keep in lockstep with
            # android-release.yml.
            - name: Check production OTA floor
              id: ota_floor
              env:
                  CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
                  VERSION_NAME: ${{ steps.version.outputs.name }}
              run: |
                  CURRENT="$(npx @capgo/cli@latest channel currentBundle production \
                    --apikey "$CAPGO_API_KEY" --quiet | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' | tail -n1 || true)"
                  if [ -z "$CURRENT" ]; then
                      echo "::error::cannot read the production channel's current bundle from Capgo — refusing to ship a binary that may strand the fleet's OTA path" >&2
                      exit 1
                  fi
                  NEEDS_OTA="$(node scripts/semver-newer.mjs "$VERSION_NAME" "$CURRENT")"
                  echo "needs_ota=$NEEDS_OTA" >> "$GITHUB_OUTPUT"
                  if [ "$NEEDS_OTA" = "true" ]; then
                      echo "versionName $VERSION_NAME is ahead of production bundle $CURRENT — a matching bundle ships after the store upload"
                  else
                      echo "versionName $VERSION_NAME is covered by production bundle $CURRENT"
                  fi

            - name: Verify SumSub Cordova plugin materialized
              # `cap sync ios` silently drops a Cordova plugin (exit 0, no folder)
              # when node_modules isn't fully materialized, and the archive then
              # fails a minute later with a cryptic SwiftPM error. Catch the real
              # cause — a partial pnpm install — here, where a re-run recovers.
              run: |
                  P=node_modules/@sumsub/cordova-idensic-mobile-sdk-plugin
                  if [ ! -f "$P/package.json" ] || [ ! -f "$P/plugin.xml" ]; then
                      echo "::error::$P is not fully installed (package.json/plugin.xml missing). This is the intermittent iOS-release flake — cap sync would drop the plugin and the archive would fail cryptically. Re-run the job (pnpm install did not materialize the plugin)."
                      ls -la "$P" 2>&1 || true
                      exit 1
                  fi
                  echo "SumSub Cordova plugin materialized."

            - name: Production web env
              run: |
                  # NEXT_PUBLIC_* values are baked into the static export at build time.
                  # rpId MUST be peanut.me (passkeys + assetlinks/AASA).
                  # Keep this block identical to ios-release.yml / android-release.yml /
                  # capgo-deploy.yml. CAPACITOR_BUILD / IS_NATIVE_BUILD / GIT_COMMIT_HASH
                  # are auto-baked by next.config.native.js.
                  # Delimiter is quoted: a secret holding $ or a backtick must land in the
                  # file verbatim, not be expanded — or executed — by the shell.
                  cat > .env.production.local <<'EOF'
                  NEXT_PUBLIC_BASE_URL=https://peanut.me
                  NEXT_PUBLIC_PEANUT_API_URL=${{ vars.NEXT_PUBLIC_PEANUT_API_URL }}
                  NEXT_PUBLIC_NATIVE_RP_ID=peanut.me
                  NEXT_PUBLIC_ZERO_DEV_BUNDLER_URL=${{ secrets.NEXT_PUBLIC_ZERO_DEV_BUNDLER_URL }}
                  NEXT_PUBLIC_ZERO_DEV_PAYMASTER_URL=${{ secrets.NEXT_PUBLIC_ZERO_DEV_PAYMASTER_URL }}
                  NEXT_PUBLIC_ZERO_DEV_PASSKEY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_ZERO_DEV_PASSKEY_PROJECT_ID }}
                  NEXT_PUBLIC_ZERO_DEV_RECOVERY_BUNDLER_URL=${{ secrets.NEXT_PUBLIC_ZERO_DEV_RECOVERY_BUNDLER_URL }}
                  NEXT_PUBLIC_JUSTANAME_ENS_DOMAIN=peanut.me
                  NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
                  NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
                  NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
                  NEXT_PUBLIC_GA_KEY=${{ vars.NEXT_PUBLIC_GA_KEY }}
                  NEXT_PUBLIC_ONESIGNAL_APP_ID=${{ secrets.NEXT_PUBLIC_ONESIGNAL_APP_ID }}
                  NEXT_PUBLIC_SAFARI_WEB_ID=${{ vars.NEXT_PUBLIC_SAFARI_WEB_ID }}
                  NEXT_PUBLIC_ONESIGNAL_WEBHOOK=${{ vars.NEXT_PUBLIC_ONESIGNAL_WEBHOOK }}
                  EOF
                  if [ "${{ inputs.pushDebug }}" = "true" ]; then
                      echo "NEXT_PUBLIC_ONESIGNAL_DEBUG=true" >> .env.production.local
                  fi

            - name: Build web + sync iOS
              env:
                  # postsync stamps project.pbxproj; without this it would stamp
                  # package.json's version, which no longer tracks releases.
                  IOS_MARKETING_VERSION: ${{ steps.version.outputs.name }}
              run: |
                  node scripts/native-build.js && npx cap sync ios
                  if [ -f scripts/native-ios-postsync.js ]; then node scripts/native-ios-postsync.js; fi

            - name: Install Apple distribution certificate
              uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
              with:
                  p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
                  p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

            - name: Install provisioning profile
              id: provision
              env:
                  IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
              run: |
                  PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
                  mkdir -p "$PROFILE_DIR"
                  echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > /tmp/profile.mobileprovision
                  # Decode the profile to read its UUID + Name (no extra secret needed).
                  security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
                  PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)
                  PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)
                  cp /tmp/profile.mobileprovision "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
                  echo "name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
                  echo "Installed provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"
                  # A profile without aps-environment ships an app that can never
                  # register with APNs, even when the entitlements file asks for it.
                  PROFILE_APS=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' /tmp/profile.plist 2>/dev/null || true)
                  if [ "$PROFILE_APS" != "production" ]; then
                      echo "::error::provisioning profile aps-environment is '${PROFILE_APS:-missing}' — enable Push Notifications on the App ID, regenerate the profile, and update IOS_PROVISIONING_PROFILE_BASE64"
                      exit 1
                  fi

            - name: Archive & export IPA
              env:
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  PROFILE_NAME: ${{ steps.provision.outputs.name }}
                  # Monotonic, always-increments-even-on-rerun. TestFlight requires each
                  # upload's build number to exceed the last.
                  IOS_BUILD_NUMBER: ${{ github.run_number }}
                  IOS_VERSION_NAME: ${{ steps.version.outputs.name }}
                  # native sentry sdk dsn — Info.plist SentryDSN <- $(SENTRY_DSN) build
                  # setting. same project dsn the js layer bakes into the static export
                  # above; no new secret needed (mirror of SENTRY_DSN_ANDROID).
                  SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
              run: |
                  # MARKETING_VERSION comes from the "Resolve release versionName"
                  # step (input > tag > package.json — the same precedence
                  # android-release.yml uses, so the two platforms cannot report
                  # different versions for one release). The project.pbxproj value is
                  # itself stamped from package.json by scripts/native-ios-postsync.js
                  # during the build step above, so this is belt-and-braces rather than
                  # the only thing standing between us and the old hand-maintained 1.0.
                  # CURRENT_PROJECT_VERSION is always the CI run number.
                  # Info.plist reads both via $(...) build settings.
                  MARKETING_ARG=("MARKETING_VERSION=$IOS_VERSION_NAME")

                  cat > /tmp/ExportOptions.plist <<EOF
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                      <key>method</key>
                      <string>app-store</string>
                      <key>teamID</key>
                      <string>${APPLE_TEAM_ID}</string>
                      <key>signingStyle</key>
                      <string>manual</string>
                      <key>provisioningProfiles</key>
                      <dict>
                          <key>me.peanut.wallet</key>
                          <string>${PROFILE_NAME}</string>
                      </dict>
                      <key>uploadSymbols</key>
                      <true/>
                  </dict>
                  </plist>
                  EOF

                  # Manual signing lives in the App target's Release build config
                  # (CODE_SIGN_STYLE=Manual, DEVELOPMENT_TEAM, CODE_SIGN_IDENTITY,
                  # PROVISIONING_PROFILE_SPECIFIER="Peanut Wallet App Store"). It is NOT
                  # passed on the command line: global build settings leak onto the SwiftPM
                  # dependency targets (Alamofire, ZIPFoundation, …), which reject a
                  # provisioning profile and fail the archive. Only version numbers, which
                  # are harmless to inherit, and SENTRY_DSN, a custom setting nothing else
                  # reads, are overridden here.
                  xcodebuild \
                      -project ios/App/App.xcodeproj \
                      -scheme App \
                      -configuration Release \
                      -destination 'generic/platform=iOS' \
                      -archivePath build/ios/App.xcarchive \
                      CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
                      "${MARKETING_ARG[@]}" \
                      SENTRY_DSN="$SENTRY_DSN" \
                      archive

                  xcodebuild \
                      -exportArchive \
                      -archivePath build/ios/App.xcarchive \
                      -exportPath build/ios \
                      -exportOptionsPlist /tmp/ExportOptions.plist

            - name: Verify push entitlements + Sentry DSN in exported IPA
              run: |
                  # Extract into a clean directory. `macos-15` is ephemeral so a stale
                  # /tmp/ipa-check cannot survive today, but unzip without -o prompts on
                  # existing files and skips them when stdin is at EOF — which on any
                  # reused runner would leave the PREVIOUS build's Payload in place and
                  # quietly verify the wrong artifact. A release gate that can pass while
                  # reading the wrong IPA is worse than no gate.
                  rm -rf /tmp/ipa-check
                  unzip -q build/ios/App.ipa -d /tmp/ipa-check
                  APS=$(codesign -d --entitlements :- /tmp/ipa-check/Payload/App.app 2>/dev/null \
                        | plutil -extract aps-environment raw -o - - || true)
                  echo "aps-environment=$APS"
                  if [ "$APS" != "production" ]; then
                      echo "::error::exported ipa aps-environment is '${APS:-missing}', expected production — push would be dead in this build"
                      exit 1
                  fi
                  # An empty, unexpanded, or malformed SentryDSN ships a build with native
                  # crash reporting silently off — sentry-cocoa disables itself on a DSN it
                  # cannot parse, and nothing downstream would tell us. Stricter than the
                  # gradle equivalent, which only logs: this runs on the actual artifact,
                  # so it can be certain rather than advisory.
                  #
                  # Matched on the shape sentry-cocoa itself requires — scheme, key, host,
                  # numeric project id — and NOT on how today's DSN happens to look. An
                  # earlier draft required a hex key and a *.sentry.io host; both are true
                  # of the current DSN and neither is guaranteed, so rotating the key or
                  # moving region would have failed every iOS release for no reason.
                  DSN=$(plutil -extract SentryDSN raw -o - /tmp/ipa-check/Payload/App.app/Info.plist 2>/dev/null || true)
                  case "$DSN" in
                      '$(SENTRY_DSN)')
                          echo "::error::exported ipa SentryDSN is the literal \$(SENTRY_DSN) — the build setting never reached xcodebuild, so this build ships blind"
                          exit 1
                          ;;
                  esac
                  if ! printf '%s' "$DSN" | grep -Eq '^https://[^@/]+@[^/]+/[0-9]+$'; then
                      echo "::error::exported ipa SentryDSN is ${DSN:+malformed}${DSN:-missing} — native crash reporting would be dead in this build"
                      exit 1
                  fi
                  echo "SentryDSN present and well-formed"

            - name: Upload dSYMs to Sentry
              # Without debug symbols every native crash arrives as hex offsets.
              # `uploadSymbols` in ExportOptions.plist goes to App Store Connect only —
              # Sentry sunset its ASC fetch in 2024. Needs a SENTRY_AUTH_TOKEN repo
              # secret (org peanut-c34d84c05, project peanut-ui, scope project:releases).
              # Until it exists this step warns and the release still ships. sentry-cli
              # is a pinned devDependency so it comes from the lockfile, not a fresh
              # registry fetch inside the signing job.
              #
              # Runs after the IPA verification: a build that fails that gate is never
              # shipped, so uploading its symbols first only leaves orphaned debug files
              # in the project.
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: peanut-c34d84c05
                  SENTRY_PROJECT: peanut-ui
              run: |
                  if [ -z "$SENTRY_AUTH_TOKEN" ]; then
                      echo "::warning::SENTRY_AUTH_TOKEN not set — dSYMs not uploaded; native iOS crashes will be unsymbolicated in Sentry"
                      exit 0
                  fi
                  pnpm exec sentry-cli debug-files upload build/ios/App.xcarchive/dSYMs

            - name: Upload to TestFlight
              uses: apple-actions/upload-testflight-build@1ad58030672057aa084b4e96beb6f7a8c627f9e6 # v5
              with:
                  app-path: build/ios/App.ipa
                  issuer-id: ${{ secrets.ASC_ISSUER_ID }}
                  api-key-id: ${{ secrets.ASC_KEY_ID }}
                  api-private-key: ${{ secrets.ASC_KEY_CONTENT }}
                  # The upload itself is what matters; the post-upload processing
                  # poll re-queries ASC for many minutes and fails when the API
                  # token expires mid-wait (401 NOT_AUTHORIZED). The build is
                  # already in App Store Connect by then, so skip the wait.
                  wait-for-processing: 'false'

            # The binary that just shipped is ahead of every production OTA bundle, so
            # its devices would refuse all existing bundles. Publish the exact JS baked
            # into this binary (the build step leaves it in out/) under the binary's own
            # version — the lanes can no longer drift apart. A failure here is the floor
            # guard firing: the job goes red instead of the fleet going silently dark.
            # Upload flags in lockstep with capgo-deploy.yml; android-release.yml
            # publishes the same version from the same tag, which --version-exists-ok
            # turns into a verified no-op.
            - name: Publish matching production OTA bundle
              if: steps.ota_floor.outputs.needs_ota == 'true'
              env:
                  CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
                  CAPGO_PRIVATE_KEY: ${{ secrets.CAPGO_PRIVATE_KEY }}
                  VERSION: ${{ steps.version.outputs.name }}
              run: |
                  if [ ! -f out/index.html ]; then
                      echo "::error::out/ is missing its static export — cannot publish the matching OTA bundle, and without it every device on the $VERSION binary refuses OTA updates" >&2
                      exit 1
                  fi
                  npx @capgo/cli@latest bundle upload \
                    --channel production \
                    --apikey "$CAPGO_API_KEY" \
                    --key-data-v2 "$CAPGO_PRIVATE_KEY" \
                    --path ./out \
                    --bundle "$VERSION" \
                    --auto-min-update-version \
                    --version-exists-ok \
                    --comment "${GITHUB_SHA:0:7} — auto-published with the $VERSION native release"
                  CURRENT="$(npx @capgo/cli@latest channel currentBundle production \
                    --apikey "$CAPGO_API_KEY" --quiet | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' | tail -n1 || true)"
                  if [ "$CURRENT" != "$VERSION" ]; then
                      echo "::error::production channel serves '${CURRENT:-<none>}', expected $VERSION — devices on the $VERSION binary have no OTA path" >&2
                      exit 1
                  fi
                  echo "Production channel now serves $VERSION"

            - name: Upload IPA as build artifact
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: app-store-ipa
                  path: build/ios/*.ipa
                  if-no-files-found: warn
