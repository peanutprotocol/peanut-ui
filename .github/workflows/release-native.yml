name: App Release Android & iOS

# After every successful main-push OTA, build that same main commit for both
# stores. A manual run on main retries the current head. The version is resolved
# here, not typed, so iOS and Android share the same native version even though existing installs
# remain on different versions.
#
# The tag is written afterwards, as the record of what shipped. A failed build
# leaves no tag, so a re-run resolves the same number instead of burning one.
#
# Ships to TestFlight and the Play `internal` track. Promotion to App Store review
# and to Play production stays a manual step in the respective consoles.
#
# A manual run on `dev` is a pre-release: the latest dev commit goes to TestFlight
# and Play internal under the next version, but writes no `v*` tag and no production
# OTA bundle. A tag on a commit `main` lacks would halt every main OTA at its
# provenance guard until the back-merge, so dev builds never become the release record.

on:
    workflow_run:
        workflows: ['App Release OTA']
        types: [completed]
        branches: [main]
    workflow_dispatch:
        inputs:
            track:
                description: 'Play track'
                required: true
                default: 'internal'
                type: choice
                options: [internal, alpha, beta, production]
            pushDebug:
                description: 'Enable OneSignal verbose logging in this build'
                required: false
                default: false
                type: boolean

permissions:
    contents: read

env:
    ALLOW_IOS_BRIDGE: '1'
    ALLOW_ANDROID_BRIDGE: '1'

concurrency:
    # Retain each queued main push; GitHub's default single pending slot would
    # silently cancel intermediate native releases during a busy merge period.
    group: production-release
    cancel-in-progress: false
    queue: max

jobs:
    resolve:
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
        runs-on: ubuntu-latest
        environment: Production
        outputs:
            version: ${{ steps.resolve.outputs.version }}
            prerelease: ${{ steps.guard.outputs.prerelease }}
        steps:
            # The app tree in every job must be the exact main or dev commit selected here.
            - name: Guard release ref
              id: guard
              env:
                  OTA_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || '' }}
                  TRACK: ${{ inputs.track || 'internal' }}
              run: |
                  if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF_TYPE" = branch ] && [ "$GITHUB_REF_NAME" = dev ]; then
                      if [ "$TRACK" != internal ]; then
                          echo "::error::dev pre-releases upload only to Play internal, not $TRACK" >&2
                          exit 1
                      fi
                      DEV_TIP="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/dev | cut -f1)"
                      if [ "$DEV_TIP" != "$GITHUB_SHA" ]; then
                          echo "::error::dev advanced after dispatch (${GITHUB_SHA:0:7} -> ${DEV_TIP:0:7}); dispatch again to build the latest dev commit" >&2
                          exit 1
                      fi
                      echo "prerelease=true" >> "$GITHUB_OUTPUT"
                      echo "Pre-release of the latest dev commit ${GITHUB_SHA:0:7}"
                      exit 0
                  fi
                  if [ "$GITHUB_REF_NAME" != "main" ] ||
                     { [ "$GITHUB_EVENT_NAME" != "workflow_run" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; }; then
                      echo "::error::native releases require a successful main OTA, a manual dispatch on main, or a manual pre-release dispatch on dev" >&2
                      exit 1
                  fi
                  echo "prerelease=false" >> "$GITHUB_OUTPUT"
                  if [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ "$GITHUB_SHA" != "$OTA_SOURCE_SHA" ]; then
                      echo "::error::main advanced between OTA and native workflow start ($OTA_SOURCE_SHA -> $GITHUB_SHA)" >&2
                      exit 1
                  fi

            - uses: actions/checkout@v7
              with:
                  # workflow_run GITHUB_SHA is the default-branch commit. The guard
                  # above proves it is the OTA's exact main commit, or the dev tip.
                  ref: ${{ github.sha }}
                  fetch-depth: 0

            - uses: actions/setup-node@v6
              with:
                  node-version: '22'

            # `native` returns latestBuild + 1 — a number, derived from the tags,
            # with no opinion on whether this commit contains the build it is
            # numbering itself after. Cut from a ref that lags the newest release
            # and the store gets a HIGHER version carrying OLDER code, which only
            # another store release can undo. The OTA lane makes the same check
            # for the same reason (see release-ota.yml).
            - name: Guard release provenance
              run: |
                  # Deliberately `newest-native`, not `native-floor`: the floor is
                  # scoped to the CURRENT major, so the first release of a new major
                  # has no floor — and skipping the check there is what would let a
                  # lagging ref build 2.1.0 without containing v1.6.0. Only a
                  # repository with no native release at all has nothing to contain.
                  FLOOR="$(node scripts/release-version.mjs newest-native --allow-none)"
                  if [ -z "$FLOOR" ]; then
                      echo "no native release exists yet — nothing to contain"
                      exit 0
                  fi
                  if ! git merge-base --is-ancestor "v$FLOOR" HEAD; then
                      echo "::error::$GITHUB_REF_NAME (${GITHUB_SHA:0:7}) does not contain the newest native release v$FLOOR — a build from it would ship a higher version than v$FLOOR carrying older code. Back-merge the release into this ref first." >&2
                      exit 1
                  fi
                  echo "${GITHUB_SHA:0:7} contains v$FLOOR"

            - name: Require compatible legacy OTA lanes before either store upload
              if: steps.guard.outputs.prerelease != 'true'
              env:
                  CAPGO_APP_ID: me.peanut.wallet
                  CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
              run: |
                  BRIDGE="$(node scripts/capgo-release-guard.mjs bridge-status)"
                  if [ "$BRIDGE" != active ]; then
                      echo '::error::iOS 1.5.x OTA bridge is not active; wait for the main-push OTA bootstrap before the store release' >&2
                      exit 1
                  fi
                  node scripts/check-native-ota-surface.mjs v1.5.0 --platform ios
                  echo "The iOS 1.5.x bridge remains compatible with this main commit"
                  ANDROID_BRIDGE="$(node scripts/capgo-release-guard.mjs android-bridge-status)"
                  if [ "$ANDROID_BRIDGE" != active ]; then
                      echo '::error::Android 1.6.x OTA bridge is not active; wait for the main-push OTA bootstrap before the store release' >&2
                      exit 1
                  fi
                  node scripts/check-native-ota-surface.mjs v1.6.0 --platform android
                  echo "The Android 1.6.x bridge remains compatible with this main commit"

            # Testers on the platform default channel receive the legacy bridge
            # bundle built from main, so a surface mismatch is worth seeing even
            # though it cannot reach the production fleet from here.
            - name: Report legacy OTA lane compatibility
              if: steps.guard.outputs.prerelease == 'true'
              run: |
                  node scripts/check-native-ota-surface.mjs v1.5.0 --platform ios ||
                      echo "::warning::iOS native surface differs from the 1.5.x bridge; this TestFlight build may receive main JS built for 1.5.0 unless testers opt into beta updates"
                  node scripts/check-native-ota-surface.mjs v1.6.0 --platform android ||
                      echo "::warning::Android native surface differs from the 1.6.x bridge; this internal build may receive main JS built for 1.6.0 unless testers opt into beta updates"

            - name: Resolve next build version
              id: resolve
              run: |
                  VERSION="$(node scripts/release-version.mjs native)"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Next native build: $VERSION (from ${GITHUB_SHA:0:7})"
                  echo "## ${{ steps.guard.outputs.prerelease == 'true' && 'Dev pre-release' || 'Release' }} $VERSION" >> "$GITHUB_STEP_SUMMARY"
                  echo "- **Commit:** ${GITHUB_SHA:0:7} ($GITHUB_REF_NAME)" >> "$GITHUB_STEP_SUMMARY"

    ios:
        needs: resolve
        uses: ./.github/workflows/ios-release.yml
        secrets: inherit
        with:
            versionName: ${{ needs.resolve.outputs.version }}
            pushDebug: ${{ inputs.pushDebug }}
            prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}

    android:
        needs: resolve
        uses: ./.github/workflows/android-release.yml
        # the called workflow's record-replacement-baseline job writes one
        # annotated tag; a caller must grant what its callee's jobs request or
        # the whole workflow fails validation at dispatch (TASK-22471).
        permissions:
            contents: write
        secrets: inherit
        with:
            versionName: ${{ needs.resolve.outputs.version }}
            track: ${{ github.event_name == 'workflow_run' && 'internal' || inputs.track }}
            pushDebug: ${{ inputs.pushDebug }}
            prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}

    tag:
        needs: [resolve, ios, android]
        if: needs.resolve.outputs.prerelease != 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}

            # GITHUB_TOKEN deliberately: GitHub does not start workflows from a push
            # made with it, so this records the release without re-triggering the
            # builds it just finished. Swapping in a PAT here would double-build.
            - name: Tag the shipped commit
              env:
                  VERSION: ${{ needs.resolve.outputs.version }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git tag -a "v$VERSION" -m "Native release $VERSION" -m "peanut-native-capabilities-v1: android.pushProvisioning=compiled ios.pushProvisioning=compiled"
                  git push origin "v$VERSION"
                  echo "Tagged v$VERSION at ${GITHUB_SHA:0:7}"
