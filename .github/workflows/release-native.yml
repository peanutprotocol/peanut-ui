name: App Release Android & iOS

# After a successful main-push OTA, or one blocked specifically by native
# incompatibility, build that same main commit for both stores. Only the first
# completion of a push-triggered main OTA may start this workflow. The version
# is resolved here, not typed, so iOS and Android share the same native version
# even though existing installs remain on different versions.
#
# The platform jobs build, upload to the stores and upload the matching OTA
# bundle to the disabled candidate channel. No production channel moves until
# both platform jobs pass: then one `publish` job promotes both channels, and
# the tag is written as the record of what shipped. If either platform fails,
# both production channels stay as they were, no tag is written, the run fails,
# and #🔥-notifs gets an alert. To retry, dispatch this workflow on main with the
# main tip SHA; a fresh reviewed main update also starts another attempt.
#
# Ships to TestFlight and the Play `internal` track. Promotion to App Store review
# and to Play production stays a manual step in the respective consoles.
#
# Changed native contracts keep the old platform bridge channels pinned. The
# later reviewed main-push OTA cutover is separate so store rollout can be verified first.

on:
    workflow_run:
        workflows: ['App Release OTA']
        types: [completed]
        branches: [main]
    # Retry a failed store build without a new main push. The run builds the
    # current main tip only; the SHA input makes the operator name it.
    workflow_dispatch:
        inputs:
            sha:
                description: 'Full SHA of the current main tip to rebuild for both stores'
                required: true
                type: string

permissions:
    contents: read

env:
    ALLOW_IOS_BRIDGE: '1'
    ALLOW_ANDROID_BRIDGE: '1'

concurrency:
    # Retain each queued main push; GitHub's default single pending slot would
    # silently cancel intermediate native releases during a busy merge period.
    group: production-release
    cancel-in-progress: false
    queue: max

jobs:
    resolve:
        if: ${{ github.run_attempt == 1 && ((github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt == 1 && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
        runs-on: ubuntu-latest
        environment: Production
        permissions:
            contents: read
            actions: read
        outputs:
            version: ${{ steps.resolve.outputs.version }}
        steps:
            # The app tree in every job must be the exact main commit selected here.
            - name: Guard release ref
              id: guard
              env:
                  OTA_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || '' }}
                  OTA_TRIGGER_EVENT: ${{ github.event.workflow_run.event || '' }}
                  OTA_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '' }}
                  INPUT_SHA: ${{ inputs.sha || '' }}
              run: |
                  if [ "$GITHUB_REF_NAME" != "main" ] || [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
                      echo '::error::native releases run only on main, once per run; dispatch a new run instead of a rerun' >&2
                      exit 1
                  fi
                  if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
                      if [ "$INPUT_SHA" != "$GITHUB_SHA" ]; then
                          echo "::error::the sha input (${INPUT_SHA:-empty}) is not the main tip this run checked out (${GITHUB_SHA:0:7})" >&2
                          exit 1
                      fi
                  elif [ "$GITHUB_EVENT_NAME" != "workflow_run" ] ||
                     { [ "$OTA_TRIGGER_EVENT" != push ] && [ "$OTA_TRIGGER_EVENT" != workflow_dispatch ]; } ||
                     [ "$OTA_RUN_ATTEMPT" != 1 ]; then
                      echo '::error::native releases require the first completion of a main OTA or a guarded manual dispatch; reruns are not releases' >&2
                      exit 1
                  elif [ "$GITHUB_SHA" != "$OTA_SOURCE_SHA" ]; then
                      echo "::error::main advanced between OTA and native workflow start ($OTA_SOURCE_SHA -> $GITHUB_SHA)" >&2
                      exit 1
                  fi
                  MAIN_TIP="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)"
                  if [ "$MAIN_TIP" != "$GITHUB_SHA" ]; then
                      echo "::error::main advanced after the OTA handoff (${GITHUB_SHA:0:7} -> ${MAIN_TIP:0:7}); a later main-push OTA must start the next release" >&2
                      exit 1
                  fi

            - name: Read native-incompatible OTA evidence
              if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
              uses: actions/download-artifact@v4
              with:
                  name: ota-native-incompatible-${{ github.event.workflow_run.id }}
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ github.token }}
                  path: ota-native-incompatible

            - name: Verify native-incompatible OTA evidence
              if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
              env:
                  OTA_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
              run: |
                  if [ "$(cat ota-native-incompatible/head.sha)" != "$OTA_SOURCE_SHA" ]; then
                      echo '::error::failed OTA did not attest native incompatibility for this main commit' >&2
                      exit 1
                  fi

            - uses: actions/checkout@v7
              with:
                  # workflow_run GITHUB_SHA is the default-branch commit. The guard
                  # above proves it is the OTA's exact main commit.
                  ref: ${{ github.sha }}
                  fetch-depth: 0

            - uses: actions/setup-node@v6
              with:
                  node-version: '22'

            # `native` returns latestBuild + 1 — a number, derived from the tags,
            # with no opinion on whether this commit contains the build it is
            # numbering itself after. Cut from a ref that lags the newest release
            # and the store gets a HIGHER version carrying OLDER code, which only
            # another store release can undo. The OTA lane makes the same check
            # for the same reason (see release-ota.yml).
            - name: Guard release provenance
              run: |
                  # Deliberately `newest-native`, not `native-floor`: the floor is
                  # scoped to the CURRENT major, so the first release of a new major
                  # has no floor — and skipping the check there is what would let a
                  # lagging ref build 2.1.0 without containing v1.6.0. Only a
                  # repository with no native release at all has nothing to contain.
                  FLOOR="$(node scripts/release-version.mjs newest-native --allow-none)"
                  if [ -z "$FLOOR" ]; then
                      echo "no native release exists yet — nothing to contain"
                      exit 0
                  fi
                  if ! git merge-base --is-ancestor "v$FLOOR" HEAD; then
                      echo "::error::$GITHUB_REF_NAME (${GITHUB_SHA:0:7}) does not contain the newest native release v$FLOOR — a build from it would ship a higher version than v$FLOOR carrying older code. Back-merge the release into this ref first." >&2
                      exit 1
                  fi
                  echo "${GITHUB_SHA:0:7} contains v$FLOOR"

            # Count past every build number Capgo already holds. A half-release
            # leaves an untagged `.0` there; reusing its number fails the
            # exact-source check after both store uploads (Oct 9 2026).
            - name: Resolve next build version
              id: resolve
              env:
                  CAPGO_APP_ID: me.peanut.wallet
                  CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
              run: |
                  RESERVED="$(node scripts/capgo-release-guard.mjs reserved-release)"
                  VERSION="$(node scripts/release-version.mjs native --reserved "$RESERVED")"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Next native build: $VERSION (from ${GITHUB_SHA:0:7}; highest version in Capgo: $RESERVED)"
                  echo "## Release $VERSION" >> "$GITHUB_STEP_SUMMARY"
                  echo "- **Commit:** ${GITHUB_SHA:0:7} ($GITHUB_REF_NAME)" >> "$GITHUB_STEP_SUMMARY"

    ios:
        needs: resolve
        if: ${{ github.run_attempt == 1 }}
        uses: ./.github/workflows/ios-release.yml
        secrets: inherit
        with:
            versionName: ${{ needs.resolve.outputs.version }}
            pushDebug: false
            prerelease: false

    android:
        needs: resolve
        if: ${{ github.run_attempt == 1 }}
        uses: ./.github/workflows/android-release.yml
        # the called workflow's record-replacement-baseline job writes one
        # annotated tag; a caller must grant what its callee's jobs request or
        # the whole workflow fails validation at dispatch (TASK-22471).
        permissions:
            contents: write
        secrets: inherit
        with:
            versionName: ${{ needs.resolve.outputs.version }}
            track: internal
            pushDebug: false
            prerelease: false

    # Runs only when both platform jobs passed. Promotes each platform channel
    # that needs the new .0; if the second promotion fails, the first channel
    # returns to its previous bundle and the run fails.
    publish:
        needs: [resolve, ios, android]
        if: ${{ github.run_attempt == 1 }}
        runs-on: ubuntu-latest
        environment: Production
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}
                  # The floors are resolved from the native release tags again.
                  fetch-depth: 0

            - uses: actions/setup-node@v6
              with:
                  node-version: '22'

            - name: Promote the native OTA bundle on both platforms
              env:
                  CAPGO_APP_ID: me.peanut.wallet
                  CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
                  VERSION: ${{ needs.resolve.outputs.version }}
                  IOS_NEEDS_OTA: ${{ needs.ios.outputs.needs_ota }}
                  ANDROID_NEEDS_OTA: ${{ needs.android.outputs.needs_ota }}
              run: bash scripts/promote-native-ota.sh

    tag:
        needs: [resolve, ios, android, publish]
        if: ${{ github.run_attempt == 1 }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}

            # GITHUB_TOKEN deliberately: GitHub does not start workflows from a push
            # made with it, so this records the release without re-triggering the
            # builds it just finished. Swapping in a PAT here would double-build.
            - name: Tag the shipped commit
              env:
                  VERSION: ${{ needs.resolve.outputs.version }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git tag -a "v$VERSION" -m "Native release $VERSION" -m "peanut-native-capabilities-v1: android.pushProvisioning=compiled ios.pushProvisioning=compiled"
                  git push origin "v$VERSION"
                  echo "Tagged v$VERSION at ${GITHUB_SHA:0:7}"

    # 18 of 37 release runs failed between 2026-09-23 and 2026-10-11 and nobody
    # was told. A skipped resolve (an OTA that failed for a reason other than
    # the native preflight) is not a failure of this workflow.
    alert:
        needs: [resolve, ios, android, publish, tag]
        if: ${{ always() && contains(needs.*.result, 'failure') }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}
                  sparse-checkout: scripts/post-release-alert.sh
                  sparse-checkout-cone-mode: false

            - uses: actions/setup-node@v6
              with:
                  node-version: '22'

            - name: Post the failure to Discord
              env:
                  DISCORD_WEBHOOK: ${{ secrets.CONTENT_PIPELINE_DISCORD_WEBHOOK }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  VERSION: ${{ needs.resolve.outputs.version }}
                  RESULTS: 'resolve=${{ needs.resolve.result }} ios=${{ needs.ios.result }} android=${{ needs.android.result }} publish=${{ needs.publish.result }} tag=${{ needs.tag.result }}'
              run: |
                  FAILED="$(tr ' ' '\n' <<< "$RESULTS" | grep '=failure$' | cut -d= -f1 | paste -sd, -)"
                  ALERT="🚨 Store build ${VERSION:-<unresolved>} failed at: ${FAILED}. Production OTA channels are unchanged and no tag was written. Run: $RUN_URL"
                  if [ "$FAILED" = publish ]; then
                      ALERT="🚨 Store build ${VERSION} uploaded to both stores, but the OTA channel promotion failed. Check that both production channels serve the same release. Run: $RUN_URL"
                  elif [ "$FAILED" = tag ]; then
                      ALERT="🚨 Store build ${VERSION} shipped and both channels were promoted, but the v${VERSION} tag was not written. The next OTA and store build count past it. Run: $RUN_URL"
                  fi
                  bash scripts/post-release-alert.sh "$ALERT"
