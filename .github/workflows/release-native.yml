name: App Release Android & iOS

# The single entry point for a store build. Click "Run workflow" on `dev`, `main`, or `release/android-kyc`; the
# version is resolved here, not typed, and both platforms build from that one
# number so they can never disagree about what a release is called.
#
# Main pushes rebuild only when the native fingerprint differs from the newest
# shipped binary. Web-only pushes stay in the OTA lane. Manual dispatch remains
# available for an intentional store rebuild even when the native surface matches.
#
# The tag is written afterwards, as the record of what shipped. A failed build
# leaves no tag, so a re-run resolves the same number instead of burning one.
#
# Ships to TestFlight and the Play `internal` track. Promotion to App Store review
# and to Play production stays a manual step in the respective consoles.

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            track:
                description: 'Play track'
                required: true
                default: 'internal'
                type: choice
                options: [internal, alpha, beta, production]
            pushDebug:
                description: 'Enable OneSignal verbose logging in this build'
                required: false
                default: false
                type: boolean

permissions:
    contents: read

concurrency:
    # One mutex across every sanctioned production release: this workflow and its
    # counterpart both end by writing the production Capgo channel, and interleaving
    # them leaves it serving a bundle the newest binary rejects. An OTA that resolves
    # its version before a concurrent native release publishes its `.0` is exactly the
    # TASK-21793 shape, so the whole resolve-through-publish span holds the mutex.
    group: production-release
    cancel-in-progress: false

jobs:
    resolve:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.resolve.outputs.version }}
            build_required: ${{ steps.native_change.outputs.required }}
        steps:
            # Only approved release branches may resolve a production version.
            # Before dispatch, verify the selected commit includes the reviewed native
            # changes and KYC fixes; the branch name alone does not prove readiness.
            - name: Guard release ref
              run: |
                  if [ "$GITHUB_REF_NAME" != "dev" ] && [ "$GITHUB_REF_NAME" != "main" ] && [ "$GITHUB_REF_NAME" != "release/android-kyc" ]; then
                      echo "::error::releases are cut from dev, main, or release/android-kyc, not $GITHUB_REF_NAME" >&2
                      exit 1
                  fi

            - uses: actions/checkout@v7
              with:
                  # Full history + tags: the resolver reads the v<major>.<build>.0 tags.
                  fetch-depth: 0

            - uses: actions/setup-node@v6
              with:
                  node-version: '22'

            - name: Decide whether a native build is required
              id: native_change
              env:
                  RELEASE_EVENT: ${{ github.event_name }}
              run: |
                  if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
                      echo "required=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  LATEST_MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
                  if [ "$LATEST_MAIN_SHA" != "$GITHUB_SHA" ]; then
                      echo "::error::main advanced before native release; refusing to build a stale commit" >&2
                      exit 1
                  fi
                  FLOOR="$(node scripts/release-version.mjs newest-native --allow-none)"
                  if [ -z "$FLOOR" ]; then
                      echo "required=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  # Importing diff preserves errors as errors; a failed check must
                  # never be mistaken for permission to release a native binary.
                  REQUIRED="$(NATIVE_BASE="v$FLOOR" node --input-type=module -e '
                    import { diff } from "./scripts/native-fingerprint.mjs";
                    console.log(diff(process.env.NATIVE_BASE, "HEAD").length > 0);
                  ')"
                  echo "required=$REQUIRED" >> "$GITHUB_OUTPUT"
                  echo "Native surface changed: $REQUIRED (baseline v$FLOOR)"

            # `native` returns latestBuild + 1 — a number, derived from the tags,
            # with no opinion on whether this commit contains the build it is
            # numbering itself after. Cut from a ref that lags the newest release
            # and the store gets a HIGHER version carrying OLDER code, which only
            # another store release can undo. The OTA lane makes the same check
            # for the same reason (see release-ota.yml).
            - name: Guard release provenance
              if: steps.native_change.outputs.required == 'true'
              run: |
                  # Deliberately `newest-native`, not `native-floor`: the floor is
                  # scoped to the CURRENT major, so the first release of a new major
                  # has no floor — and skipping the check there is what would let a
                  # lagging ref build 2.1.0 without containing v1.6.0. Only a
                  # repository with no native release at all has nothing to contain.
                  FLOOR="$(node scripts/release-version.mjs newest-native --allow-none)"
                  if [ -z "$FLOOR" ]; then
                      echo "no native release exists yet — nothing to contain"
                      exit 0
                  fi
                  if ! git merge-base --is-ancestor "v$FLOOR" HEAD; then
                      echo "::error::$GITHUB_REF_NAME (${GITHUB_SHA:0:7}) does not contain the newest native release v$FLOOR — a build from it would ship a higher version than v$FLOOR carrying older code. Back-merge the release into this ref first." >&2
                      exit 1
                  fi
                  echo "${GITHUB_SHA:0:7} contains v$FLOOR"

            - name: Resolve next build version
              if: steps.native_change.outputs.required == 'true'
              id: resolve
              run: |
                  VERSION="$(node scripts/release-version.mjs native)"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Next native build: $VERSION (from ${GITHUB_SHA:0:7})"
                  echo "## Release $VERSION" >> "$GITHUB_STEP_SUMMARY"
                  echo "- **Commit:** ${GITHUB_SHA:0:7}" >> "$GITHUB_STEP_SUMMARY"

    ios:
        needs: resolve
        if: needs.resolve.outputs.build_required == 'true'
        uses: ./.github/workflows/ios-release.yml
        secrets: inherit
        with:
            versionName: ${{ needs.resolve.outputs.version }}
            pushDebug: ${{ inputs.pushDebug || false }}

    android:
        needs: resolve
        if: needs.resolve.outputs.build_required == 'true'
        uses: ./.github/workflows/android-release.yml
        # the called workflow's record-replacement-baseline job writes one
        # annotated tag; a caller must grant what its callee's jobs request or
        # the whole workflow fails validation at dispatch (TASK-22471).
        permissions:
            contents: write
        secrets: inherit
        with:
            versionName: ${{ needs.resolve.outputs.version }}
            track: ${{ inputs.track || 'internal' }}
            pushDebug: ${{ inputs.pushDebug || false }}

    tag:
        needs: [resolve, ios, android]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7

            # GITHUB_TOKEN deliberately: GitHub does not start workflows from a push
            # made with it, so this records the release without re-triggering the
            # builds it just finished. Swapping in a PAT here would double-build.
            - name: Tag the shipped commit
              env:
                  VERSION: ${{ needs.resolve.outputs.version }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git tag -a "v$VERSION" -m "Native release $VERSION" -m "peanut-native-capabilities-v1: android.pushProvisioning=compiled ios.pushProvisioning=compiled"
                  git push origin "v$VERSION"
                  echo "Tagged v$VERSION at ${GITHUB_SHA:0:7}"
