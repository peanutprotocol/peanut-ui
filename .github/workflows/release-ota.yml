name: App Release OTA

# Production OTA releases run automatically after every update to main. A
# manual dispatch of this workflow on dev can also ship the current main tree
# using the newer release tooling from dev. In both cases, the selected main
# commit must contain the newest attested native release and pass native
# compatibility checks. It uploads
# two signed platform bundle records to an inactive candidate channel, verifies
# their exact metadata, then promotes each to its platform production channel.
#
# The version always lands inside the current native build's range
# (<major>.<build>.<ota+1>), so it cannot sort below the binary it targets — the
# failure mode that left 102 devices refusing every update for a month
# (TASK-21793). Shipping a second OTA on the same binary is just another run; the
# `ota-1.0.48-hotfix1` style of suffixed tag is no longer needed.
#
# The tag is written afterwards as the record of what shipped. A failed deploy
# leaves no tag; any partial upload still reserves its number for a fresh retry.

on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    CAPGO_APP_ID: me.peanut.wallet

permissions:
    contents: read

concurrency:
    # One mutex across every sanctioned production release: this workflow and its
    # counterparts write the platform production channels, and interleaving
    # them can leave a channel serving a bundle the newest binary rejects. An OTA that resolves
    # its version before a concurrent native release publishes its `.0` is exactly the
    # TASK-21793 shape, so the whole resolve-through-publish span holds the mutex.
    group: production-release
    cancel-in-progress: false

jobs:
    resolve:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.resolve.outputs.version }}
            source_sha: ${{ steps.source.outputs.sha }}
        defaults:
            run:
                working-directory: app
        steps:
            # The manual lane is deliberately dispatched on dev, where the
            # platform-aware release tooling lives. The app tree is always main.
            - name: Guard release ref
              working-directory: .
              run: |
                  if { [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF_NAME" != "main" ]; } &&
                     { [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$GITHUB_REF_NAME" != "dev" ]; }; then
                      echo "::error::production OTA requires a main push or a manual dispatch on dev" >&2
                      exit 1
                  fi

            - name: Check out release tooling
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}
                  path: release-tooling

            - name: Check out main app source
              uses: actions/checkout@v7
              with:
                  # A dispatch on dev pins main at checkout; a main push uses
                  # the event's exact commit. Full history supplies native tags.
                  ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
                  path: app
                  fetch-depth: 0

            - uses: actions/setup-node@v6
              with:
                  node-version: '22'

            - name: Pin current main commit
              id: source
              run: |
                  SOURCE_SHA="$(git rev-parse HEAD)"
                  LATEST_MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
                  if [ "$SOURCE_SHA" != "$LATEST_MAIN_SHA" ]; then
                      echo "::error::main advanced while the OTA source was selected ($SOURCE_SHA -> $LATEST_MAIN_SHA)" >&2
                      exit 1
                  fi
                  echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
                  echo "Selected main source ${SOURCE_SHA:0:7}"

            # The resolver below compares NUMBERS only: it lands the next OTA inside
            # the newest native build's range, which by construction sorts above the
            # binary — whether or not the commit being published actually contains
            # that release. Nothing here asked, and on 2026-09-10 a production bundle
            # shipped from a commit predating the v1.6.0 release, handing every
            # device on the new binary JS older than the one baked into it.
            #
            # check-native-ota-surface asserts the same ancestry, but only as a
            # precondition of its fingerprint diff, in the deploy job, after a full
            # install and native build — and a stale ref whose native surface happens
            # to match would still read as "matches". Say it here, in seconds, and say
            # what the consequence is.
            - name: Guard release provenance
              env:
                  SOURCE_SHA: ${{ steps.source.outputs.sha }}
              run: |
                  FLOOR="$(node ../release-tooling/scripts/release-version.mjs newest-native --root "$PWD")"
                  if ! git merge-base --is-ancestor "v$FLOOR" HEAD; then
                      echo "::error::main (${SOURCE_SHA:0:7}) does not contain the newest native release v$FLOOR — publishing it would hand every device on that binary JS older than the one it shipped with. Back-merge the release into main first." >&2
                      exit 1
                  fi
                  echo "main ${SOURCE_SHA:0:7} contains v$FLOOR"

            - name: Resolve next OTA version
              id: resolve
              env:
                  CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
                  SOURCE_SHA: ${{ steps.source.outputs.sha }}
              run: |
                  CURRENT="$(node ../release-tooling/scripts/capgo-release-guard.mjs current-release)"
                  VERSION="$(node ../release-tooling/scripts/release-version.mjs ota --current "$CURRENT" --root "$PWD")"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Highest current or reserved release is $CURRENT — next OTA is $VERSION"
                  {
                    echo "## OTA $VERSION"
                    echo "- **Replaces:** $CURRENT"
                    echo "- **Main commit:** ${SOURCE_SHA:0:7}"
                  } >> "$GITHUB_STEP_SUMMARY"

    deploy:
        needs: resolve
        runs-on: ubuntu-latest
        environment: Production
        env:
            OTA_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        defaults:
            run:
                working-directory: app
        steps:
            - name: Check out release tooling
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}
                  path: release-tooling

            - name: Check out pinned main app source
              uses: actions/checkout@v7
              with:
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}
                  ref: ${{ needs.resolve.outputs.source_sha }}
                  path: app
                  fetch-depth: 0

            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
              with:
                  package_json_file: app/package.json

            - uses: actions/setup-node@v6
              with:
                  node-version: '20'
                  cache: 'pnpm'
                  cache-dependency-path: app/pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # NEXT_PUBLIC_* values are baked into the static export at build time.
            # rpId MUST be peanut.me (passkeys + assetlinks/AASA). CAPACITOR_BUILD /
            # IS_NATIVE_BUILD / GIT_COMMIT_HASH are auto-baked by next.config.native.js.
            # Delimiter is quoted: a secret holding $ or a backtick must land in the
            # file verbatim, not be expanded — or executed — by the shell.
            # Before the bake: these two land in the static export, so the bundle
            # carries the oldest binary of each platform it may run on. Also an
            # early surface check — the resolver refuses outright when no shipped
            # binary of a platform carries this tree's contract, which is the same
            # condition "Check the native surface" fails on, minus the build.
            - name: Resolve per-platform OTA floors
              id: ota_floors
              env:
                  MANUAL_MAIN_SOURCE: ${{ github.event_name == 'workflow_dispatch' }}
              run: |
                  # main's current updater compares the bundle's major/build
                  # to the installed binary, without the newer per-platform
                  # floor marker. Limit a manual main-source OTA to the newest
                  # native build so Capgo does not offer it to older shells.
                  if [ "$MANUAL_MAIN_SOURCE" = "true" ]; then
                    ANDROID="$(node ../release-tooling/scripts/release-version.mjs native-floor --root "$PWD")"
                    IOS="$ANDROID"
                  else
                    ANDROID="$(node ../release-tooling/scripts/ota-platform-floor.mjs --platform android --root "$PWD")"
                    IOS="$(node ../release-tooling/scripts/ota-platform-floor.mjs --platform ios --root "$PWD")"
                  fi
                  {
                    echo "android=$ANDROID"
                    echo "ios=$IOS"
                  } >> "$GITHUB_OUTPUT"
                  echo "Delivery floors — android $ANDROID, ios $IOS"

            - name: Bake production NEXT_PUBLIC_* into the static export
              run: |
                  cat > .env.production.local <<'EOF'
                  NEXT_PUBLIC_BASE_URL=https://peanut.me
                  NEXT_PUBLIC_PEANUT_API_URL=${{ vars.NEXT_PUBLIC_PEANUT_API_URL }}
                  NEXT_PUBLIC_NATIVE_RP_ID=peanut.me
                  NEXT_PUBLIC_ZERO_DEV_BUNDLER_URL=${{ secrets.NEXT_PUBLIC_ZERO_DEV_BUNDLER_URL }}
                  NEXT_PUBLIC_ZERO_DEV_PAYMASTER_URL=${{ secrets.NEXT_PUBLIC_ZERO_DEV_PAYMASTER_URL }}
                  NEXT_PUBLIC_ZERO_DEV_PASSKEY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_ZERO_DEV_PASSKEY_PROJECT_ID }}
                  NEXT_PUBLIC_ZERO_DEV_RECOVERY_BUNDLER_URL=${{ secrets.NEXT_PUBLIC_ZERO_DEV_RECOVERY_BUNDLER_URL }}
                  NEXT_PUBLIC_JUSTANAME_ENS_DOMAIN=peanut.me
                  NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
                  NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
                  NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
                  NEXT_PUBLIC_GA_KEY=${{ vars.NEXT_PUBLIC_GA_KEY }}
                  NEXT_PUBLIC_ONESIGNAL_APP_ID=${{ secrets.NEXT_PUBLIC_ONESIGNAL_APP_ID }}
                  NEXT_PUBLIC_SAFARI_WEB_ID=${{ vars.NEXT_PUBLIC_SAFARI_WEB_ID }}
                  NEXT_PUBLIC_ONESIGNAL_WEBHOOK=${{ vars.NEXT_PUBLIC_ONESIGNAL_WEBHOOK }}
                  NEXT_PUBLIC_OTA_FLOOR_ANDROID=${{ steps.ota_floors.outputs.android }}
                  NEXT_PUBLIC_OTA_FLOOR_IOS=${{ steps.ota_floors.outputs.ios }}
                  EOF

            - name: Build native static export
              run: node scripts/native-build.js

            # A queued run can finish building after a newer commit lands on
            # main. Re-read the remote ref after the expensive build so a stale
            # bundle cannot advance into the candidate/promotion sequence.
            - name: Guard current main after build
              env:
                  EXPECTED_MAIN_SHA: ${{ needs.resolve.outputs.source_sha }}
              run: |
                  LATEST_MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
                  if [ "$LATEST_MAIN_SHA" != "$EXPECTED_MAIN_SHA" ]; then
                      echo "::error::main advanced during the build ($EXPECTED_MAIN_SHA -> $LATEST_MAIN_SHA); refusing to publish a stale OTA" >&2
                      exit 1
                  fi
                  echo "main is still ${EXPECTED_MAIN_SHA:0:7} after the build"

            - name: Verify build output
              run: |
                  test -d out && test -f out/index.html || (echo "ERROR: out/ directory missing or incomplete" && exit 1)
                  echo "Bundle ready. File count: $(find out -type f | wc -l)"

            - name: Resolve bundle version
              id: version
              env:
                  VERSION: ${{ needs.resolve.outputs.version }}
              run: |
                  if [ -z "$VERSION" ]; then
                      echo "::error::the OTA resolver did not provide a bundle version" >&2
                      exit 1
                  fi
                  echo "name=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Uploading as platform bundle versions $VERSION-ios and $VERSION-android"

            # Resolve the floor from the release tags and fail closed when none is
            # visible. The bundle must target the newest native shell it can safely
            # run on.
            - name: Resolve native floor
              id: native_floor
              run: |
                  FLOOR="$(node ../release-tooling/scripts/release-version.mjs native-floor --root "$PWD")"
                  echo "name=$FLOOR" >> "$GITHUB_OUTPUT"
                  echo "Bundle requires native $FLOOR or newer"

            # A bundle's version says nothing about the native surface it needs, so
            # verify that the JS being published still matches the released binary.
            - name: Check the native surface still matches that binary
              env:
                  FLOOR: ${{ steps.native_floor.outputs.name }}
              run: |
                  if ! git rev-parse -q --verify "refs/tags/v$FLOOR" >/dev/null; then
                      echo "::error::no v$FLOOR tag in this checkout — cannot prove the bundle fits the binary it targets (needs fetch-depth: 0 and tags)" >&2
                      exit 1
                  fi
                  node scripts/check-native-capabilities.mjs "v$FLOOR"
                  node ../release-tooling/scripts/check-native-ota-surface.mjs "v$FLOOR" --platform android --root "$PWD"
                  node ../release-tooling/scripts/check-native-ota-surface.mjs "v$FLOOR" --platform ios --root "$PWD"

            - name: Prepare disabled candidate channel
              env:
                  CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
              run: node ../release-tooling/scripts/capgo-release-guard.mjs prepare-candidate

            - name: Upload bundles to Capgo
              env:
                  CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
                  CAPGO_PRIVATE_KEY: ${{ secrets.CAPGO_PRIVATE_KEY }}
                  RELEASE_VERSION: ${{ steps.version.outputs.name }}
                  FLOOR_ANDROID: ${{ steps.ota_floors.outputs.android }}
                  FLOOR_IOS: ${{ steps.ota_floors.outputs.ios }}
              run: |
                  COMMIT_MSG="$(git log -1 --format=%s)"
                  COMMENT="${OTA_SOURCE_SHA:0:7} — $(printf '%s' "${COMMIT_MSG:-Manual deploy}" | head -n1) [ota-floors: android=$FLOOR_ANDROID ios=$FLOOR_IOS]"
                  # Different records: min_update_version belongs to the bundle,
                  # not the channel. Old clients are protected by the server.
                  for PLATFORM in ios android; do
                    VERSION="$RELEASE_VERSION-$PLATFORM"
                    UPLOAD_GUARD_ARGS=(--channel ota-candidate)
                    if [ "$PLATFORM" = ios ]; then
                      NATIVE_FLOOR="$FLOOR_IOS"
                    else
                      NATIVE_FLOOR="$FLOOR_ANDROID"
                      # Both platform records deliberately contain the same web
                      # assets. Keep the duplicate check for the first upload,
                      # then allow the second record with its Android floor.
                      UPLOAD_GUARD_ARGS+=(--ignore-checksum-check)
                    fi
                    npx @capgo/cli@8.42.4 bundle upload \
                      "${UPLOAD_GUARD_ARGS[@]}" \
                      --apikey "$CAPGO_API_KEY" --key-data-v2 "$CAPGO_PRIVATE_KEY" \
                      --path ./out --bundle "$VERSION" --min-update-version "$NATIVE_FLOOR" \
                      --comment "$COMMENT" --link "https://github.com/peanutprotocol/peanut-ui/commit/$OTA_SOURCE_SHA"
                  done

            # Both fresh uploads and exact artifact checks must succeed before
            # either production channel moves. Collisions never count as success.
            - name: Verify the floors reached the bundles
              env:
                  CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
                  RELEASE_VERSION: ${{ steps.version.outputs.name }}
                  FLOOR_ANDROID: ${{ steps.ota_floors.outputs.android }}
                  FLOOR_IOS: ${{ steps.ota_floors.outputs.ios }}
              run: |
                  for PLATFORM in ios android; do
                    export PLATFORM VERSION="$RELEASE_VERSION-$PLATFORM"
                    if [ "$PLATFORM" = ios ]; then export NATIVE_FLOOR="$FLOOR_IOS"; else export NATIVE_FLOOR="$FLOOR_ANDROID"; fi
                    node ../release-tooling/scripts/capgo-release-guard.mjs verify-bundle
                  done

            - name: Promote verified bundles to platform production
              env:
                  CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
                  RELEASE_VERSION: ${{ steps.version.outputs.name }}
                  FLOOR_ANDROID: ${{ steps.ota_floors.outputs.android }}
                  FLOOR_IOS: ${{ steps.ota_floors.outputs.ios }}
                  EXPECTED_MAIN_SHA: ${{ needs.resolve.outputs.source_sha }}
              run: |
                  guard_current_main() {
                    LATEST_MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
                    if [ "$LATEST_MAIN_SHA" != "$EXPECTED_MAIN_SHA" ]; then
                      echo "::error::main advanced before production promotion ($EXPECTED_MAIN_SHA -> $LATEST_MAIN_SHA); refusing to promote a stale OTA" >&2
                      exit 1
                    fi
                    echo "main is still ${EXPECTED_MAIN_SHA:0:7} before production promotion"
                  }

                  for PLATFORM in ios android; do
                    export PLATFORM VERSION="$RELEASE_VERSION-$PLATFORM"
                    if [ "$PLATFORM" = ios ]; then export NATIVE_FLOOR="$FLOOR_IOS"; else export NATIVE_FLOOR="$FLOOR_ANDROID"; fi
                    # Re-check immediately before EACH production mutation: the
                    # first platform promotion can finish while main advances
                    # before the second platform is promoted.
                    guard_current_main
                    # Bundle selection and rollout disablement are one Capgo
                    # mutation, followed by exact channel and artifact readback.
                    node ../release-tooling/scripts/capgo-release-guard.mjs promote-production
                    node ../release-tooling/scripts/capgo-release-guard.mjs verify-production
                  done

            - name: Deployment summary
              run: |
                  {
                    echo "## OTA Deployment"
                    echo "- **Channels:** ios-mobile-release, android-mobile-release"
                    echo "- **Bundle versions:** ${{ steps.version.outputs.name }}-ios, ${{ steps.version.outputs.name }}-android"
                    echo "- **Main commit:** ${{ needs.resolve.outputs.source_sha }}"
                    echo "- **Release tooling commit:** ${{ github.sha }}"
                  } >> "$GITHUB_STEP_SUMMARY"

    tag:
        needs: [resolve, deploy]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Check out shipped main commit
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.resolve.outputs.source_sha }}
                  path: app

            # GITHUB_TOKEN deliberately: GitHub does not start workflows from a push
            # made with it, so this records the OTA without re-triggering the deploy
            # it just finished. Swapping in a PAT here would double-ship.
            - name: Tag the shipped commit
              working-directory: app
              env:
                  VERSION: ${{ needs.resolve.outputs.version }}
                  SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
              run: |
                  if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
                      echo "::error::tag checkout does not match the shipped main commit" >&2
                      exit 1
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git tag -a "ota-$VERSION" -m "OTA release $VERSION"
                  git push origin "ota-$VERSION"
                  echo "Tagged ota-$VERSION at ${SOURCE_SHA:0:7}"
