name: Screen library baseline

on:
    # Refresh the baseline after a main-branch update. The capture itself is
    # pinned to the current dev revision so PRs targeting dev compare against
    # the same integration branch they will merge into.
    push:
        branches: [main]
    # The manual trigger is useful after enabling the workflow or after an
    # artifact-retention gap.
    workflow_dispatch:

permissions:
    contents: read

jobs:
    capture:
        runs-on: macos-26-intel
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                locale: [en, es-419, es-AR, pt-BR]
        steps:
            - name: Resolve immutable dev revision
              id: revision
              env:
                  GH_TOKEN: ${{ github.token }}
              run: echo "sha=$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/dev --jq .object.sha)" >> "$GITHUB_OUTPUT"
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ steps.revision.outputs.sha }}
                  path: harness
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}
                  persist-credentials: false
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ steps.revision.outputs.sha }}
                  path: target
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}
                  persist-credentials: false
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: 10.30.1
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '22'
            - name: Install capture tools
              working-directory: harness
              run: pnpm install --frozen-lockfile
            - name: Install pinned browser
              working-directory: harness
              run: pnpm exec playwright install --with-deps --no-shell chromium
            - name: Build and capture full dev catalogue
              working-directory: harness
              env:
                  TARGET_SHA: ${{ steps.revision.outputs.sha }}
              run: node scripts/screens/run-capture.mjs ../target "$TARGET_SHA" ../capture --full-catalogue --locale=${{ matrix.locale }}
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  # The triggering run SHA is the main-branch commit; the
                  # artifact name binds the capture to the dev SHA checked out
                  # above so the trusted publisher can select it exactly.
                  name: screen-library-baseline-${{ steps.revision.outputs.sha }}-${{ matrix.locale }}-${{ github.run_attempt }}
                  path: capture/
                  if-no-files-found: error
                  retention-days: 7
