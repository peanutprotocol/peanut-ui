name: Deploy screen gallery
on:
    push:
        branches: [dev]
        paths:
            - 'public/screen-library/**'
            - 'scripts/screens/worker/**'
            - '.github/workflows/screen-library-deploy.yml'
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: screen-gallery-deploy
    cancel-in-progress: false
jobs:
    deploy:
        if: github.ref == 'refs/heads/dev'
        environment: screen-library-deploy
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '22'
            - name: Install isolated deployment tool from the committed lockfile
              run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/screens/deploy
            - name: Prepare static gallery and R2 binding
              env:
                  SCREEN_LIBRARY_R2_BUCKET: ${{ vars.SCREEN_LIBRARY_R2_BUCKET }}
                  SCREEN_LIBRARY_R2_JURISDICTION: ${{ vars.SCREEN_LIBRARY_R2_JURISDICTION }}
                  SCREEN_LIBRARY_PUBLIC_URL: ${{ vars.SCREEN_LIBRARY_PUBLIC_URL }}
              run: node scripts/screens/worker/prepare.mjs /tmp/screen-gallery
            - name: Deploy trusted dev gallery
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
              run: scripts/screens/deploy/node_modules/.bin/wrangler deploy --config /tmp/screen-gallery/wrangler.json
