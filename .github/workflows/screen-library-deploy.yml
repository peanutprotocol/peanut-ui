name: Deploy screen gallery
on:
    push:
        branches: [dev]
        paths:
            - 'public/screen-library/**'
            - 'scripts/screens/worker/**'
            - '.github/workflows/screen-library-deploy.yml'
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: screen-gallery-deploy
    cancel-in-progress: false
jobs:
    deploy:
        if: github.ref == 'refs/heads/dev'
        environment: screen-library-deploy
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
            - name: Install isolated deployment tool
              run: npm install --ignore-scripts --no-save --package-lock=false --prefix /tmp/screen-deploy wrangler@4.40.2
            - name: Prepare static gallery and R2 binding
              env:
                  SCREEN_LIBRARY_R2_BUCKET: ${{ vars.SCREEN_LIBRARY_R2_BUCKET }}
                  SCREEN_LIBRARY_R2_JURISDICTION: ${{ vars.SCREEN_LIBRARY_R2_JURISDICTION }}
                  SCREEN_LIBRARY_PUBLIC_URL: ${{ vars.SCREEN_LIBRARY_PUBLIC_URL }}
              run: node scripts/screens/worker/prepare.mjs /tmp/screen-gallery
            - name: Deploy trusted dev gallery
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
              run: /tmp/screen-deploy/node_modules/.bin/wrangler deploy --config /tmp/screen-gallery/wrangler.json
