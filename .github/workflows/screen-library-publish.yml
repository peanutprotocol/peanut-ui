name: Publish screen library
on:
    workflow_call:
        secrets:
            # Keep the trusted dev caller compatible while it migrates to the
            # standard secret name in a follow-up change.
            CLOUDFLARE_PUBLISH_TOKEN:
                required: false
            CLOUDFLARE_API_TOKEN:
                required: false
permissions:
    contents: read
    actions: read
    pull-requests: write
jobs:
    route:
        if: github.repository == 'peanutprotocol/peanut-ui' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        runs-on: ubuntu-24.04
        timeout-minutes: 3
        permissions:
            contents: read
        outputs:
            mode: ${{ steps.route.outputs.mode }}
            gallery: ${{ steps.route.outputs.gallery }}
            refresh_indexes: ${{ steps.route.outputs.refresh_indexes }}
            deploy_gallery: ${{ steps.route.outputs.deploy_gallery }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: dev
                  persist-credentials: false
                  fetch-depth: 0
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '22'
            - name: Derive trusted delivery route from the exact push
              id: route
              env:
                  BEFORE: ${{ github.event.before }}
                  AFTER: ${{ github.sha }}
                  EVENT: ${{ github.event_name }}
                  BRANCH: ${{ github.ref_name }}
              run: node scripts/screens/decide-capture.mjs

    publish:
        needs: route
        if: >-
            always() && !cancelled() && github.repository == 'peanutprotocol/peanut-ui' &&
            (needs.route.result == 'skipped' || (needs.route.result == 'success' && needs.route.outputs.mode != 'skip')) &&
            (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        outputs:
            published: ${{ steps.publication.outputs.published }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: dev
                  persist-credentials: false
                  fetch-depth: 0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: 10.30.1
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '22'
            # Install only trusted publisher dependencies from the committed lockfile.
            - run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/screens/publisher
            - name: Link isolated publisher dependencies
              run: ln -s "$GITHUB_WORKSPACE/scripts/screens/publisher/node_modules" node_modules
            - name: Download capture artifacts from this run
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  github-token: ${{ github.token }}
                  run-id: ${{ github.run_id }}
                  pattern: screen-library-*
                  merge-multiple: false
                  path: incoming
            - name: Resolve verified baseline when needed
              id: baseline
              env:
                  GH_TOKEN: ${{ github.token }}
                  RUN_ID: ${{ github.run_id }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  if find incoming -mindepth 2 -maxdepth 2 -path '*/capture.json' -path '*screen-library-before-*' -print -quit | grep -q .; then
                      echo 'mode=current' >> "$GITHUB_OUTPUT"
                  else
                      echo 'mode=external' >> "$GITHUB_OUTPUT"
                      node scripts/screens/resolve-baseline.mjs >> "$GITHUB_OUTPUT"
                  fi
            - name: Download verified baseline
              if: steps.baseline.outputs.mode == 'external'
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  github-token: ${{ github.token }}
                  repository: ${{ github.repository }}
                  run-id: ${{ steps.baseline.outputs.run_id }}
                  pattern: screen-library-*
                  merge-multiple: false
                  path: incoming/baseline
            - name: Verify provenance and publish
              id: publication
              env:
                  GH_TOKEN: ${{ github.token }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_PUBLISH_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                  SCREEN_LIBRARY_R2_BUCKET: ${{ vars.SCREEN_LIBRARY_R2_BUCKET }}
                  SCREEN_LIBRARY_R2_JURISDICTION: ${{ vars.SCREEN_LIBRARY_R2_JURISDICTION }}
                  SCREEN_LIBRARY_PUBLIC_URL: ${{ vars.SCREEN_LIBRARY_PUBLIC_URL }}
                  RUN_ID: ${{ github.run_id }}
                  RUN_ATTEMPT: ${{ github.run_attempt }}
                  REPOSITORY: ${{ github.repository }}
                  SCREEN_LIBRARY_BASELINE_DIR: ${{ steps.baseline.outputs.mode == 'external' && 'incoming/baseline' || '' }}
                  # These are the original caller event fields in workflow_call,
                  # not values supplied by downloaded capture artifacts.
                  PUSH_BEFORE: ${{ github.event.before }}
                  MAIN_BEFORE: ${{ github.event.inputs.before_sha }}
                  MAIN_AFTER: ${{ github.event.inputs.after_sha }}
                  SCREEN_LIBRARY_BASELINE_RUN_ID: ${{ steps.baseline.outputs.run_id }}
                  SCREEN_LIBRARY_BASELINE_ARTIFACT: ${{ steps.baseline.outputs.artifact_name }}
              run: node scripts/screens/publish-run.mjs

    gallery:
        needs: route
        if: needs.route.result == 'success' && needs.route.outputs.mode == 'skip' && needs.route.outputs.gallery == 'true' && !cancelled()
        uses: peanutprotocol/peanut-ui/.github/workflows/screen-library-gallery.yml@dev
        with:
            refresh_indexes: ${{ needs.route.outputs.mode == 'skip' && needs.route.outputs.refresh_indexes == 'true' }}
            deploy_gallery: ${{ needs.route.outputs.deploy_gallery == 'true' }}
        secrets:
            CLOUDFLARE_PUBLISH_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_PUBLISH_TOKEN }}

    # Reports, entries and content-addressed assets are immutable and may upload
    # concurrently. Serialize only the short shared index/latest refresh so one
    # run cannot overwrite another run's catalogue update.
    index:
        needs: publish
        # Entry markers may already be committed even if the later PR comment
        # update fails, so always reconcile the index after a completed batch.
        if: always() && needs.publish.outputs.published == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        concurrency:
            group: screen-library-index
            queue: max
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: dev
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '22'
            - run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/screens/publisher
            - run: ln -s "$GITHUB_WORKSPACE/scripts/screens/publisher/node_modules" node_modules
            - name: Refresh shared library indexes
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_PUBLISH_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                  SCREEN_LIBRARY_R2_BUCKET: ${{ vars.SCREEN_LIBRARY_R2_BUCKET }}
                  SCREEN_LIBRARY_R2_JURISDICTION: ${{ vars.SCREEN_LIBRARY_R2_JURISDICTION }}
                  SCREEN_LIBRARY_PUBLIC_URL: ${{ vars.SCREEN_LIBRARY_PUBLIC_URL }}
              run: node scripts/screens/rebuild-index.mjs
    deploy:
        needs: index
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: peanutprotocol/peanut-ui/.github/workflows/screen-library-gallery.yml@dev
        with:
            refresh_indexes: false
            deploy_gallery: true
        secrets:
            CLOUDFLARE_PUBLISH_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_PUBLISH_TOKEN }}
