name: Publish screen library
on:
    workflow_call:
        secrets:
            # Keep the trusted dev caller compatible while it migrates to the
            # standard secret name in a follow-up change.
            CLOUDFLARE_PUBLISH_TOKEN:
                required: false
            CLOUDFLARE_API_TOKEN:
                required: false
permissions:
    contents: read
    actions: read
    pull-requests: write
# Serialize the public index update. Never run downloaded scripts or HTML.
concurrency:
    group: screen-library-publisher
    queue: max
    cancel-in-progress: false
jobs:
    publish:
        if: github.repository == 'peanutprotocol/peanut-ui' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: dev
                  persist-credentials: false
                  fetch-depth: 0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: 10.30.1
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '22'
            # Install only trusted publisher dependencies from the committed lockfile.
            - run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/screens/publisher
            - name: Link isolated publisher dependencies
              run: ln -s "$GITHUB_WORKSPACE/scripts/screens/publisher/node_modules" node_modules
            - name: Download capture artifacts from this run
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  github-token: ${{ github.token }}
                  run-id: ${{ github.run_id }}
                  pattern: screen-library-*
                  merge-multiple: false
                  path: incoming
            - name: Resolve verified baseline when needed
              id: baseline
              env:
                  GH_TOKEN: ${{ github.token }}
                  RUN_ID: ${{ github.run_id }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  if find incoming -mindepth 2 -maxdepth 2 -path '*/capture.json' -path '*screen-library-before-*' -print -quit | grep -q .; then
                      echo 'mode=current' >> "$GITHUB_OUTPUT"
                  else
                      echo 'mode=external' >> "$GITHUB_OUTPUT"
                      node scripts/screens/resolve-baseline.mjs >> "$GITHUB_OUTPUT"
                  fi
            - name: Download verified baseline
              if: steps.baseline.outputs.mode == 'external'
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  github-token: ${{ github.token }}
                  repository: ${{ github.repository }}
                  run-id: ${{ steps.baseline.outputs.run_id }}
                  pattern: screen-library-*
                  merge-multiple: false
                  path: incoming/baseline
            - name: Verify provenance and publish
              env:
                  GH_TOKEN: ${{ github.token }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_PUBLISH_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                  SCREEN_LIBRARY_R2_BUCKET: ${{ vars.SCREEN_LIBRARY_R2_BUCKET }}
                  SCREEN_LIBRARY_R2_JURISDICTION: ${{ vars.SCREEN_LIBRARY_R2_JURISDICTION }}
                  SCREEN_LIBRARY_PUBLIC_URL: ${{ vars.SCREEN_LIBRARY_PUBLIC_URL }}
                  RUN_ID: ${{ github.run_id }}
                  RUN_ATTEMPT: ${{ github.run_attempt }}
                  REPOSITORY: ${{ github.repository }}
                  SCREEN_LIBRARY_BASELINE_DIR: ${{ steps.baseline.outputs.mode == 'external' && 'incoming/baseline' || '' }}
                  SCREEN_LIBRARY_BASELINE_RUN_ID: ${{ steps.baseline.outputs.run_id }}
                  SCREEN_LIBRARY_BASELINE_ARTIFACT: ${{ steps.baseline.outputs.artifact_name }}
              run: node scripts/screens/publish-run.mjs
    deploy:
        needs: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        environment: screen-library-deploy
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # Deploy the same trusted dev revision whose publication
                  # completed, not a newer branch tip that raced this run.
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '22'
            - name: Install isolated deployment tool from the committed lockfile
              run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/screens/deploy
            - name: Prepare migrated gallery and R2 binding
              env:
                  SCREEN_LIBRARY_R2_BUCKET: ${{ vars.SCREEN_LIBRARY_R2_BUCKET }}
                  SCREEN_LIBRARY_R2_JURISDICTION: ${{ vars.SCREEN_LIBRARY_R2_JURISDICTION }}
                  SCREEN_LIBRARY_PUBLIC_URL: ${{ vars.SCREEN_LIBRARY_PUBLIC_URL }}
              run: node scripts/screens/worker/prepare.mjs /tmp/screen-gallery
            - name: Deploy private gallery after publication
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_PUBLISH_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
                      echo 'CLOUDFLARE_API_TOKEN is missing from the reusable screen-library publisher.' >&2
                      exit 1
                  fi
                  scripts/screens/deploy/node_modules/.bin/wrangler deploy --config /tmp/screen-gallery/wrangler.json
            - name: Prepare collection API Worker
              if: vars.SCREEN_LIBRARY_COLLECTION_API_URL != ''
              env:
                  SCREEN_LIBRARY_R2_BUCKET: ${{ vars.SCREEN_LIBRARY_R2_BUCKET }}
                  SCREEN_LIBRARY_R2_JURISDICTION: ${{ vars.SCREEN_LIBRARY_R2_JURISDICTION }}
                  SCREEN_LIBRARY_PUBLIC_URL: ${{ vars.SCREEN_LIBRARY_PUBLIC_URL }}
                  SCREEN_LIBRARY_ACCESS_AUD: ${{ vars.SCREEN_LIBRARY_ACCESS_AUD }}
                  SCREEN_LIBRARY_COLLECTION_API_URL: ${{ vars.SCREEN_LIBRARY_COLLECTION_API_URL }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
              run: node scripts/screens/collection-worker/prepare.mjs /tmp/screen-collections
            - name: Deploy collection API Worker
              if: vars.SCREEN_LIBRARY_COLLECTION_API_URL != ''
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_PUBLISH_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
              run: scripts/screens/deploy/node_modules/.bin/wrangler deploy --config /tmp/screen-collections/wrangler.json
            - name: Install isolated MCP deployment dependencies
              if: vars.SCREEN_LIBRARY_MCP_URL != ''
              run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/screens/mcp
            - name: Prepare MCP Worker
              if: vars.SCREEN_LIBRARY_MCP_URL != ''
              env:
                  SCREEN_LIBRARY_MCP_URL: ${{ vars.SCREEN_LIBRARY_MCP_URL }}
                  SCREEN_LIBRARY_ACCESS_AUD: ${{ vars.SCREEN_LIBRARY_ACCESS_AUD }}
              run: |
                  node scripts/screens/mcp/prepare.mjs /tmp/screen-library-mcp
                  ln -s "$GITHUB_WORKSPACE/scripts/screens/mcp/node_modules" /tmp/screen-library-mcp/node_modules
            - name: Deploy MCP Worker
              if: vars.SCREEN_LIBRARY_MCP_URL != ''
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_PUBLISH_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
              run: scripts/screens/mcp/node_modules/.bin/wrangler deploy --config /tmp/screen-library-mcp/wrangler.json
