name: Publish screen library
on:
    workflow_call:
        secrets:
            SCREEN_LIBRARY_BLOB_TOKEN:
                required: true
permissions:
    contents: read
    actions: read
    pull-requests: write
# Serialize the public index update. Never run downloaded scripts or HTML.
concurrency:
    group: screen-library-publisher
    queue: max
    cancel-in-progress: false
jobs:
    publish:
        if: github.repository == 'peanutprotocol/peanut-ui' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: dev
                  persist-credentials: false
                  fetch-depth: 0
            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: 10.30.1
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
            # Install only trusted publisher dependencies; do not execute app install scripts.
            - run: npm install --ignore-scripts --no-save --package-lock=false --prefix /tmp/screen-publisher pixelmatch@7.2.0 pngjs@7.0.0 @vercel/blob@2.3.1 sharp@0.34.5
            - name: Link isolated publisher dependencies
              run: ln -s /tmp/screen-publisher/node_modules node_modules
            - name: Check storage configuration
              env:
                  SCREEN_LIBRARY_BLOB_TOKEN: ${{ secrets.SCREEN_LIBRARY_BLOB_TOKEN }}
              run: test -n "$SCREEN_LIBRARY_BLOB_TOKEN" || { echo "Configure SCREEN_LIBRARY_BLOB_TOKEN for a dedicated public Vercel Blob store." >&2; exit 1; }
            - name: Download current attempt captures
              uses: actions/download-artifact@v4
              with:
                  github-token: ${{ github.token }}
                  run-id: ${{ github.run_id }}
                  pattern: screen-library-*-${{ github.run_attempt }}
                  path: incoming
            - name: Verify provenance and publish
              env:
                  GH_TOKEN: ${{ github.token }}
                  SCREEN_LIBRARY_BLOB_TOKEN: ${{ secrets.SCREEN_LIBRARY_BLOB_TOKEN }}
                  RUN_ID: ${{ github.run_id }}
                  RUN_ATTEMPT: ${{ github.run_attempt }}
                  REPOSITORY: ${{ github.repository }}
              run: node scripts/screens/publish-run.mjs
