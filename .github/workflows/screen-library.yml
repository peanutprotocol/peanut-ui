name: Screen library
on:
    pull_request:
        branches: [dev]
        types: [opened, synchronize, reopened]
    push:
        branches: [dev]
    workflow_dispatch:

permissions:
    contents: read

# Supersede only older revisions of the same PR. Dev pushes and manual captures
# keep a unique run-scoped group so integration reports are never cancelled.
concurrency:
    group: screen-library-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # Runs first; every job below waits for it (backdoor-scan.yml).
    backdoor-scan:
        uses: ./.github/workflows/backdoor-scan.yml
        secrets:
            TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

    refs:
        needs: backdoor-scan
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-24.04
        outputs:
            before: ${{ steps.refs.outputs.before }}
            after: ${{ steps.refs.outputs.after }}
            capture_before: ${{ steps.refs.outputs.capture_before }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Resolve immutable pair
              id: refs
              env:
                  EVENT: ${{ github.event_name }}
                  PR_HEAD: ${{ github.event.pull_request.head.sha }}
                  PR_BASE: ${{ github.event.pull_request.base.sha }}
                  PUSH_HEAD: ${{ github.sha }}
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  set -euo pipefail
                  after="${PR_HEAD:-$PUSH_HEAD}"
                  [[ "$after" =~ ^[a-f0-9]{40}$ ]]
                  if [ "$EVENT" = pull_request ]; then
                    before=$(git merge-base "$PR_BASE" "$after")
                  elif [ "$EVENT" = push ]; then
                    before=$(node scripts/screens/integration.mjs "$after")
                  else
                    [ "$GITHUB_REF" = refs/heads/dev ] || { echo "Dispatch historical capture on dev" >&2; exit 1; }
                    before=$(git rev-list --first-parent -1 --before=2026-08-28T00:00:00+01:00 origin/main)
                  fi
                  [[ "$before" =~ ^[a-f0-9]{40}$ ]]
                  echo "before=$before" >> "$GITHUB_OUTPUT"
                  echo "after=$after" >> "$GITHUB_OUTPUT"
                  capture_before=true
                  if [ "$EVENT" = pull_request ]; then
                    capture_before=false
                    if ! git diff --quiet "$before...$after" -- \
                      scripts/screens \
                      src/dev/screens \
                      src/dev/surfaces \
                      src/dev/fixtures \
                      src/utils/demo-api.ts \
                      src/constants/demo-data.ts \
                      src/constants/residence.consts.ts \
                      pnpm-lock.yaml; then
                      capture_before=true
                    fi
                  fi
                  echo "capture_before=$capture_before" >> "$GITHUB_OUTPUT"
    capture_after:
        needs: refs
        # PR commits capture the changed revision. Product-only PRs reuse the
        # verified baseline; harness-changing PRs also run capture_before.
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                locale: [en, es-419, es-AR, pt-BR]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  path: harness
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}
                  persist-credentials: false
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ needs.refs.outputs.after }}
                  path: target
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}
                  persist-credentials: false
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: 10.30.1
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '22'
            - name: Install capture tools
              working-directory: harness
              run: pnpm install --frozen-lockfile
            - name: Install pinned browser
              working-directory: harness
              run: pnpm exec playwright install --with-deps --no-shell chromium
            - name: Build and capture exact revision
              working-directory: harness
              env:
                  TARGET_SHA: ${{ needs.refs.outputs.after }}
              run: node scripts/screens/run-capture.mjs ../target "$TARGET_SHA" ../capture --locale=${{ matrix.locale }}
            - name: Record required baseline mode
              if: github.event_name == 'pull_request' && needs.refs.outputs.capture_before == 'true'
              run: echo '{"requireSameRunBaseline":true}' > capture/screen-library-requirement.json
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: screen-library-after-${{ matrix.locale }}-${{ github.run_attempt }}
                  path: capture/
                  if-no-files-found: error
                  retention-days: 14
            # The reusable publisher is intentionally pinned to trusted dev.
            # Keep an English alias so the old publisher can still render a
            # preview while this matrix change is being reviewed.
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always() && matrix.locale == 'en'
              with:
                  name: screen-library-after-${{ github.run_attempt }}
                  path: capture/
                  if-no-files-found: error
                  retention-days: 14

    capture_before:
        needs: refs
        # Pushes and historical dispatch keep same-run pairs. A PR only needs
        # this expensive job when its harness/fixture identity can differ from
        # the verified baseline; ordinary product-only PRs reuse that baseline.
        if: github.event_name != 'pull_request' || needs.refs.outputs.capture_before == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                locale: [en, es-419, es-AR, pt-BR]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  path: harness
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}
                  persist-credentials: false
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ needs.refs.outputs.before }}
                  path: target
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}
                  persist-credentials: false
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: 10.30.1
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '22'
            - name: Install capture tools
              working-directory: harness
              run: pnpm install --frozen-lockfile
            - name: Install pinned browser
              working-directory: harness
              run: pnpm exec playwright install --with-deps --no-shell chromium
            - name: Build and capture exact revision
              working-directory: harness
              env:
                  TARGET_SHA: ${{ needs.refs.outputs.before }}
              run: node scripts/screens/run-capture.mjs ../target "$TARGET_SHA" ../capture --locale=${{ matrix.locale }}
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: screen-library-before-${{ matrix.locale }}-${{ github.run_attempt }}
                  path: capture/
                  if-no-files-found: error
                  retention-days: 14
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always() && matrix.locale == 'en'
              with:
                  name: screen-library-before-${{ github.run_attempt }}
                  path: capture/
                  if-no-files-found: error
                  retention-days: 14

    publish:
        needs: [refs, capture_after, capture_before]
        if: >-
            always() && !cancelled() && needs.refs.result == 'success' &&
            needs.capture_after.result != 'skipped' &&
            (github.event_name == 'pull_request' || needs.capture_before.result != 'skipped')
        permissions:
            contents: read
            actions: read
            pull-requests: write
        # Resolve the secret-bearing publisher only from trusted dev code.
        uses: peanutprotocol/peanut-ui/.github/workflows/screen-library-publish.yml@dev
        secrets:
            # The dev-pinned publisher accepts this compatibility alias until
            # its standard CLOUDFLARE_API_TOKEN input is deployed.
            CLOUDFLARE_PUBLISH_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
