name: Screen library
on:
    pull_request:
        branches: [dev]
        types: [opened, synchronize, reopened]
    push:
        branches: [dev]
    workflow_dispatch:

permissions:
    contents: read
# Keep every merge report; do not cancel an older integration when a new PR lands.
jobs:
    refs:
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-24.04
        outputs:
            before: ${{ steps.refs.outputs.before }}
            after: ${{ steps.refs.outputs.after }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Resolve immutable pair
              id: refs
              env:
                  EVENT: ${{ github.event_name }}
                  PR_HEAD: ${{ github.event.pull_request.head.sha }}
                  PR_BASE: ${{ github.event.pull_request.base.sha }}
                  PUSH_HEAD: ${{ github.sha }}
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  set -euo pipefail
                  after="${PR_HEAD:-$PUSH_HEAD}"
                  [[ "$after" =~ ^[a-f0-9]{40}$ ]]
                  if [ "$EVENT" = pull_request ]; then
                    before=$(git merge-base "$PR_BASE" "$after")
                  elif [ "$EVENT" = push ]; then
                    before=$(node scripts/screens/integration.mjs "$after")
                  else
                    [ "$GITHUB_REF" = refs/heads/dev ] || { echo "Dispatch historical capture on dev" >&2; exit 1; }
                    before=$(git rev-list --first-parent -1 --before=2026-08-28T00:00:00+01:00 origin/main)
                  fi
                  [[ "$before" =~ ^[a-f0-9]{40}$ ]]
                  echo "before=$before" >> "$GITHUB_OUTPUT"
                  echo "after=$after" >> "$GITHUB_OUTPUT"
    capture:
        needs: refs
        # Original tutorials use HEVC with alpha; preserve native decoding.
        runs-on: macos-26-intel
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                side: [before, after]
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  path: harness
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}
                  persist-credentials: false
            - uses: actions/checkout@v4
              with:
                  ref: ${{ matrix.side == 'before' && needs.refs.outputs.before || needs.refs.outputs.after }}
                  path: target
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}
                  persist-credentials: false
            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: 10.30.1
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
            - name: Install capture tools
              working-directory: harness
              run: pnpm install --frozen-lockfile
            - name: Install pinned browser
              working-directory: harness
              run: pnpm exec playwright install --with-deps --no-shell chromium
            - name: Build and capture exact revision
              working-directory: harness
              env:
                  TARGET_SHA: ${{ matrix.side == 'before' && needs.refs.outputs.before || needs.refs.outputs.after }}
              run: node scripts/screens/run-capture.mjs ../target "$TARGET_SHA" ../capture
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: screen-library-${{ matrix.side }}-${{ github.run_attempt }}
                  path: capture/
                  if-no-files-found: error
                  retention-days: 14

    publish:
        needs: [refs, capture]
        if: always() && !cancelled() && needs.refs.result == 'success' && needs.capture.result != 'skipped'
        permissions:
            contents: read
            actions: read
            pull-requests: write
        # Resolve trusted publishing code from dev, never from the PR checkout.
        # Land the reusable publisher (#3107) on dev before this caller (#3108).
        uses: peanutprotocol/peanut-ui/.github/workflows/screen-library-publish.yml@dev
        secrets:
            # Keep the reusable-workflow input compatible with the current dev callee.
            # The repository secret itself is named CLOUDFLARE_API_TOKEN.
            CLOUDFLARE_PUBLISH_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
