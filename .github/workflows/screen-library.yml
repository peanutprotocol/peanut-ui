name: Screen library
on:
    pull_request:
        branches: [dev]
        types: [opened, synchronize, reopened]
    push:
        branches: [dev]
    workflow_dispatch:

permissions:
    contents: read
# Keep every merge report; do not cancel an older integration when a new PR lands.
jobs:
    refs:
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-24.04
        outputs:
            before: ${{ steps.refs.outputs.before }}
            after: ${{ steps.refs.outputs.after }}
            capture_before: ${{ steps.refs.outputs.capture_before }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Resolve immutable pair
              id: refs
              env:
                  EVENT: ${{ github.event_name }}
                  PR_HEAD: ${{ github.event.pull_request.head.sha }}
                  PR_BASE: ${{ github.event.pull_request.base.sha }}
                  PUSH_HEAD: ${{ github.sha }}
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  set -euo pipefail
                  after="${PR_HEAD:-$PUSH_HEAD}"
                  [[ "$after" =~ ^[a-f0-9]{40}$ ]]
                  if [ "$EVENT" = pull_request ]; then
                    before=$(git merge-base "$PR_BASE" "$after")
                  elif [ "$EVENT" = push ]; then
                    before=$(node scripts/screens/integration.mjs "$after")
                  else
                    [ "$GITHUB_REF" = refs/heads/dev ] || { echo "Dispatch historical capture on dev" >&2; exit 1; }
                    before=$(git rev-list --first-parent -1 --before=2026-08-28T00:00:00+01:00 origin/main)
                  fi
                  [[ "$before" =~ ^[a-f0-9]{40}$ ]]
                  echo "before=$before" >> "$GITHUB_OUTPUT"
                  echo "after=$after" >> "$GITHUB_OUTPUT"
                  capture_before=true
                  if [ "$EVENT" = pull_request ]; then
                    capture_before=false
                    if git diff --name-only "$before...$after" | rg '^(scripts/screens/|src/dev/screens/|src/dev/surfaces/|src/dev/fixtures/|src/utils/demo-api\.ts$|src/constants/(demo-data|residence\.consts)\.ts$|pnpm-lock\.yaml$)' >/dev/null; then
                      capture_before=true
                    fi
                  fi
                  echo "capture_before=$capture_before" >> "$GITHUB_OUTPUT"
    capture_after:
        needs: refs
        # PR commits capture the changed revision. Product-only PRs reuse the
        # verified daily baseline; harness-changing PRs also run capture_before.
        runs-on: macos-26-intel
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  path: harness
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}
                  persist-credentials: false
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ needs.refs.outputs.after }}
                  path: target
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}
                  persist-credentials: false
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: 10.30.1
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '22'
            - name: Install capture tools
              working-directory: harness
              run: pnpm install --frozen-lockfile
            - name: Install pinned browser
              working-directory: harness
              run: pnpm exec playwright install --with-deps --no-shell chromium
            - name: Build and capture exact revision
              working-directory: harness
              env:
                  TARGET_SHA: ${{ needs.refs.outputs.after }}
              run: node scripts/screens/run-capture.mjs ../target "$TARGET_SHA" ../capture
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: screen-library-after-${{ github.run_attempt }}
                  path: capture/
                  if-no-files-found: error
                  retention-days: 14

    capture_before:
        needs: refs
        # Pushes and historical dispatch keep same-run pairs. A PR only needs
        # this expensive job when its harness/fixture identity can differ from
        # the daily baseline; ordinary product-only PRs reuse that baseline.
        if: github.event_name != 'pull_request' || needs.refs.outputs.capture_before == 'true'
        runs-on: macos-26-intel
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  path: harness
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}
                  persist-credentials: false
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ needs.refs.outputs.before }}
                  path: target
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}
                  persist-credentials: false
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: 10.30.1
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '22'
            - name: Install capture tools
              working-directory: harness
              run: pnpm install --frozen-lockfile
            - name: Install pinned browser
              working-directory: harness
              run: pnpm exec playwright install --with-deps --no-shell chromium
            - name: Build and capture exact revision
              working-directory: harness
              env:
                  TARGET_SHA: ${{ needs.refs.outputs.before }}
              run: node scripts/screens/run-capture.mjs ../target "$TARGET_SHA" ../capture
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: screen-library-before-${{ github.run_attempt }}
                  path: capture/
                  if-no-files-found: error
                  retention-days: 14

    publish:
        needs: [refs, capture_after, capture_before]
        if: >-
            always() && !cancelled() && needs.refs.result == 'success' &&
            needs.capture_after.result != 'skipped' &&
            (github.event_name == 'pull_request' || needs.capture_before.result != 'skipped')
        permissions:
            contents: read
            actions: read
            pull-requests: write
        # Resolve trusted publishing code from dev, never from the PR checkout.
        # Land the reusable publisher (#3107) on dev before this caller (#3108).
        uses: peanutprotocol/peanut-ui/.github/workflows/screen-library-publish.yml@dev
        secrets:
            # The repository secret itself is named CLOUDFLARE_API_TOKEN.
            CLOUDFLARE_PUBLISH_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
