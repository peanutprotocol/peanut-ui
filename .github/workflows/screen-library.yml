name: Screen library
on:
    pull_request:
        branches: [dev]
        # converted_to_draft starts a run that skips refs and so cancels an active capture.
        types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    push:
        branches: [dev, main]
    workflow_dispatch:
        inputs:
            before_sha:
                description: 'Main backfill: previous main SHA (defaults to the first parent of after_sha)'
                type: string
                required: false
            after_sha:
                description: 'Main backfill: released main SHA (defaults to the selected main revision)'
                type: string
                required: false

permissions:
    contents: read

# Supersede only older revisions of the same PR. Dev pushes and manual captures
# keep a unique run-scoped group so integration reports are never cancelled.
concurrency:
    group: screen-library-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # Runs first; every job below waits for it (backdoor-scan.yml).
    backdoor-scan:
        uses: ./.github/workflows/backdoor-scan.yml
        secrets:
            TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

    refs:
        needs: backdoor-scan
        # Drafts capture once they are marked ready for review.
        if: >-
            github.event_name != 'pull_request' ||
            (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
        outputs:
            before: ${{ steps.refs.outputs.before }}
            after: ${{ steps.refs.outputs.after }}
            mode: ${{ steps.impact.outputs.mode || steps.plan.outputs.mode }}
            only: ${{ steps.impact.outputs.only }}
            locales: ${{ steps.plan.outputs.locales }}
            gallery: ${{ steps.plan.outputs.gallery }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Resolve immutable pair
              id: refs
              env:
                  EVENT: ${{ github.event_name }}
                  PR_HEAD: ${{ github.event.pull_request.head.sha }}
                  PR_BASE: ${{ github.event.pull_request.base.sha }}
                  PUSH_HEAD: ${{ github.sha }}
                  PUSH_BEFORE: ${{ github.event.before }}
                  MAIN_BEFORE: ${{ inputs.before_sha }}
                  MAIN_AFTER: ${{ inputs.after_sha }}
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  set -euo pipefail
                  if [ "$EVENT" = push ] || { [ "$GITHUB_REF" = refs/heads/main ] && [ "$EVENT" = workflow_dispatch ]; }; then
                    node scripts/screens/capture-revisions.mjs >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  after="${PR_HEAD:-$PUSH_HEAD}"
                  [[ "$after" =~ ^[a-f0-9]{40}$ ]]
                  if [ "$EVENT" = pull_request ]; then
                    before=$(git merge-base "$PR_BASE" "$after")
                  else
                    [ "$GITHUB_REF" = refs/heads/dev ] || { echo "Dispatch historical capture on dev" >&2; exit 1; }
                    before=$(git rev-list --first-parent -1 --before=2026-08-28T00:00:00+01:00 origin/main)
                  fi
                  [[ "$before" =~ ^[a-f0-9]{40}$ ]]
                  echo "before=$before" >> "$GITHUB_OUTPUT"
                  echo "after=$after" >> "$GITHUB_OUTPUT"
            - name: Decide before installing capture dependencies
              id: plan
              env:
                  BEFORE: ${{ steps.refs.outputs.before }}
                  AFTER: ${{ steps.refs.outputs.after }}
                  EVENT: ${{ github.event_name }}
                  BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
                  # Live labels, so adding screens:all-locales and re-running takes effect.
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: node scripts/screens/decide-capture.mjs
            - name: Install isolated impact parser
              if: steps.plan.outputs.mode != 'skip' && github.event_name == 'pull_request'
              run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/screens/publisher
            - name: Resolve trusted compatible screen scope
              id: impact
              if: steps.plan.outputs.mode != 'skip' && github.event_name == 'pull_request'
              env:
                  BEFORE: ${{ steps.refs.outputs.before }}
                  AFTER: ${{ steps.refs.outputs.after }}
                  EVENT: ${{ github.event_name }}
                  BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
              run: node scripts/screens/decide-capture.mjs --impact
    capture_after:
        needs: refs
        if: needs.refs.outputs.mode != 'skip'
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                locale: ${{ fromJSON(needs.refs.outputs.locales || '["en","es-419","es-AR","pt-BR"]') }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  path: harness
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}
                  persist-credentials: false
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ needs.refs.outputs.after }}
                  path: target
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}
                  persist-credentials: false
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: 10.30.1
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '22'
            - name: Install capture tools
              working-directory: harness
              run: pnpm install --frozen-lockfile
            - name: Install pinned browser
              working-directory: harness
              run: pnpm exec playwright install --with-deps --no-shell chromium
            - name: Build and capture exact revision
              working-directory: harness
              env:
                  TARGET_SHA: ${{ needs.refs.outputs.after }}
                  CAPTURE_ONLY: ${{ needs.refs.outputs.only }}
              shell: bash
              run: |
                  args=()
                  if [ -n "$CAPTURE_ONLY" ]; then args+=("--scope=targeted" "--only=$CAPTURE_ONLY"); fi
                  node scripts/screens/run-capture.mjs ../target "$TARGET_SHA" ../capture --locale=${{ matrix.locale }} "${args[@]}" ${{ github.ref == 'refs/heads/main' && '--full-catalogue' || '' }}
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: screen-library-after-${{ matrix.locale }}-${{ github.run_attempt }}
                  path: capture/
                  if-no-files-found: error
                  retention-days: 14
            # The reusable publisher is intentionally pinned to trusted dev.
            # Keep an English alias so the old publisher can still render a
            # preview while this matrix change is being reviewed.
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always() && matrix.locale == 'en'
              with:
                  name: screen-library-after-${{ github.run_attempt }}
                  path: capture/
                  if-no-files-found: error
                  retention-days: 14

    capture_before:
        needs: [refs, capture_after]
        # Verify the actual after environment before app/browser installation.
        if: needs.refs.outputs.mode != 'skip' && needs.capture_after.result == 'success'
        permissions:
            contents: read
            actions: read
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                locale: ${{ fromJSON(needs.refs.outputs.locales || '["en","es-419","es-AR","pt-BR"]') }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  path: harness
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}
                  persist-credentials: false
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ needs.refs.outputs.before }}
                  path: target
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}
                  persist-credentials: false
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: 10.30.1
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '22'
            - name: Download this locale's completed after capture
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: screen-library-after-${{ matrix.locale }}-${{ github.run_attempt }}
                  path: after
            - name: Install isolated baseline verifier
              working-directory: harness
              run: |
                  npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/screens/publisher
                  ln -s scripts/screens/publisher/node_modules node_modules
            - name: Select verified exact-before capture
              id: reuse
              working-directory: harness
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  BEFORE: ${{ needs.refs.outputs.before }}
                  LOCALE: ${{ matrix.locale }}
              run: node scripts/screens/select-before.mjs ../after ../capture
            - name: Check current PR before fresh fallback
              id: current
              working-directory: harness
              env:
                  GH_TOKEN: ${{ github.token }}
                  EVENT: ${{ github.event_name }}
                  REPOSITORY: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_HEAD: ${{ github.event.pull_request.head.sha }}
                  PR_BASE: ${{ github.event.pull_request.base.sha }}
              run: node scripts/screens/check-review-current.mjs
            - name: Install capture tools
              if: steps.current.outputs.current != 'false' && steps.reuse.outputs.reused != 'true'
              working-directory: harness
              run: |
                  rm node_modules
                  pnpm install --frozen-lockfile
            - name: Install pinned browser
              if: steps.current.outputs.current != 'false' && steps.reuse.outputs.reused != 'true'
              working-directory: harness
              run: pnpm exec playwright install --with-deps --no-shell chromium
            - name: Build and capture exact revision
              if: steps.current.outputs.current != 'false' && steps.reuse.outputs.reused != 'true'
              working-directory: harness
              env:
                  TARGET_SHA: ${{ needs.refs.outputs.before }}
                  CAPTURE_ONLY: ${{ needs.refs.outputs.only }}
              shell: bash
              run: |
                  args=()
                  if [ -n "$CAPTURE_ONLY" ]; then args+=("--scope=targeted" "--only=$CAPTURE_ONLY"); fi
                  node scripts/screens/run-capture.mjs ../target "$TARGET_SHA" ../capture --locale=${{ matrix.locale }} "${args[@]}" ${{ github.ref == 'refs/heads/main' && '--full-catalogue' || '' }}
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always() && steps.current.outputs.current != 'false'
              with:
                  name: screen-library-before-${{ matrix.locale }}-${{ github.run_attempt }}
                  path: capture/
                  if-no-files-found: error
                  retention-days: 14
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always() && steps.current.outputs.current != 'false' && matrix.locale == 'en'
              with:
                  name: screen-library-before-${{ github.run_attempt }}
                  path: capture/
                  if-no-files-found: error
                  retention-days: 14

    gallery:
        needs: refs
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.refs.outputs.mode == 'skip' && needs.refs.outputs.gallery == 'true'
        permissions:
            contents: read
            actions: read
            pull-requests: write
        # This reusable path already exists on dev before this PR merges.
        # Trusted code derives maintenance flags from the exact push event.
        uses: peanutprotocol/peanut-ui/.github/workflows/screen-library-publish.yml@dev
        secrets:
            CLOUDFLARE_PUBLISH_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    publish:
        needs: [refs, capture_after, capture_before]
        if: >-
            always() && !cancelled() && needs.refs.result == 'success' &&
            needs.refs.outputs.mode != 'skip' && needs.capture_after.result != 'skipped' &&
            (github.event_name == 'pull_request' || needs.capture_before.result != 'skipped')
        permissions:
            contents: read
            actions: read
            pull-requests: write
        # Resolve the secret-bearing publisher only from trusted dev code.
        uses: peanutprotocol/peanut-ui/.github/workflows/screen-library-publish.yml@dev
        secrets:
            # The dev-pinned publisher accepts this compatibility alias until
            # its standard CLOUDFLARE_API_TOKEN input is deployed.
            CLOUDFLARE_PUBLISH_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
