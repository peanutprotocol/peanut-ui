name: Tests

on:
    # push is post-merge signal only. `['**']` double-ran the whole suite on
    # every PR commit (push + pull_request runs on the same SHA, in different
    # concurrency groups, so neither cancelled the other).
    # content-publish-automerge's merge-on-green requires "at least one and
    # ALL green" ci-success check runs per SHA, so one run per SHA satisfies it.
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev, develop]
    workflow_dispatch:

# Cancel in-progress runs on the same PR / branch when a newer commit lands.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    # `checks: write` lets dorny/test-reporter publish per-PR check
    # annotations from the JUnit XML below.
    checks: write

jobs:
    # Prettier formatting + content-link validation. Fast, no node_modules
    # needed beyond what setup-node cache restores.
    # (Renamed from "lint" — the job never actually ran a linter; ESLint now
    # lives in its own blocking job below.)
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'pnpm'

            - run: pnpm install --frozen-lockfile

            - name: Check formatting
              run: pnpm prettier --check .

            # Validates content-submodule integrity. BLOCKING — runs the
            # 11-pass verify-content suite, including:
            #   • Pass 1: every /...link in published blog/country/etc. markdown
            #     resolves to a static route
            #   • Pass 3: every href in the homepage footer-manifest resolves
            #   • Pass 11: every URL `sitemap.ts` would emit has a matching
            #     static route AND its data source is non-empty (catches the
            #     May 2026 SEO-loader regression where `generateStaticParams`
            #     returned [] and silently 404-ed ~625 SEO pages).
            - name: Validate sitemap, footer, and blog links
              run: pnpm validate-links

    # DS debt ratchet (DS 10, TASK-21450). Runs scripts/ds-lint-counts.mjs
    # --check against the committed baseline: debt counts (raw hex, inline
    # styles, stock text sizes, non-DS classes in views, useSearchParams files)
    # may only go down. A PR that lowers a count should also tighten the
    # baseline (--write-baseline) so the gain locks in. Pure-node script — no
    # pnpm install needed.
    ds-lint:
        runs-on: ubuntu-latest
        steps:
            # no submodules/token: the count script only reads src/**/*.ts(x)
            # and the only submodule (src/content) holds none. no git ops after
            # checkout either, so don't persist credentials.
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: DS lint-count ratchet
              run: node scripts/ds-lint-counts.mjs --check

    # Blocking ESLint pass (DS 10, TASK-21450). Errors reached zero on
    # feat/design-system, so this gates the PR via ci-success.needs. Warnings
    # do not fail the job; add a warn floor only if the team decides one.
    eslint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'pnpm'

            - run: pnpm install --frozen-lockfile

            - name: Run ESLint
              run: pnpm lint

    # Typecheck job. Independent of unit tests so type errors surface in
    # parallel.
    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'pnpm'

            - run: pnpm install --frozen-lockfile

            # Generate Next.js route + asset type declarations without a full
            # build. tsconfig includes .next/types/**/*.ts; without these,
            # next-env.d.ts's image-types references can't resolve and every
            # static-asset import (.svg/.gif/.webp) cascades into TS2307.
            - name: Generate Next types
              run: pnpm next typegen

            - name: Typecheck
              run: pnpm typecheck

    unit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'pnpm'

            - run: pnpm install --frozen-lockfile

            - name: Generate Next types
              run: pnpm next typegen

            # Fetch the canonical 49-entry HistoryEntry baseline from the BE
            # repo. Living source-of-truth = peanut-api-ts/test/integration/
            # __fixtures__/history-real-staging.jsonl. We don't vendor a copy
            # in this repo because it bloats every FE diff by ~3.7K lines.
            # PR base branch tracks the BE branch the FE is coordinated with
            # (dev when targeting dev; the paired BE PR's HEAD when in flight).
            - name: Fetch BE render-snapshot baseline
              env:
                  GH_TOKEN: ${{ secrets.PEANUT_ALL_READ_TOKEN }}
              run: |
                  BE_REF="${{ github.base_ref || 'dev' }}"
                  gh api "repos/peanutprotocol/peanut-api-ts/contents/test/integration/__fixtures__/history-real-staging.jsonl?ref=${BE_REF}" \
                      --jq '.content' | base64 -d > /tmp/be-baseline.jsonl
                  node scripts/import-be-baseline.mjs /tmp/be-baseline.jsonl \
                      src/components/TransactionDetails/__tests__/fixtures/be-entries.json

            - name: Run unit tests
              run: pnpm test:unit:ci

            - name: Publish unit test report
              uses: dorny/test-reporter@v1
              if: always()
              with:
                  name: Unit test report
                  path: test-results/junit.xml
                  reporter: jest-junit
                  fail-on-error: false

            - name: Upload unit coverage
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-unit
                  path: coverage/coverage-final.json
                  retention-days: 7

            - name: Upload unit JUnit XML
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: junit-unit
                  path: test-results/junit.xml
                  retention-days: 7

    # Can this PR move a pixel? Answered from the PR file list over the API, so
    # a docs-only, workflow-only or test-only PR skips the capture with no
    # checkout and no install.
    ds-shots-filter:
        name: ds-shots-filter
        # A fork PR gets a read-only GITHUB_TOKEN and no SUBMODULE_TOKEN, so
        # neither the submodule checkout nor the comment can work. Skip it.
        if: >-
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        # Reads the PR file list and nothing else.
        permissions:
            contents: read
            pull-requests: read
        outputs:
            render: ${{ steps.check.outputs.render }}
        steps:
            - name: Look for a file that changes what a screen renders
              id: check
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR: ${{ github.event.pull_request.number }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  # Everything a fixture screen is built from. src/ is most of
                  # it; the config files decide how src/ compiles, and the lock
                  # file decides which version of every dependency renders.
                  KEEP='^(src/|e2e/shots/|scripts/visual-(diff|comment)\.mjs$|playwright\.shots\.config\.ts$|(tailwind|postcss|next)\.config\.|package\.json$|pnpm-lock\.yaml$|\.github/workflows/tests\.yml$)'
                  # Inside the set above but never on camera. src/content is the
                  # blog and SEO submodule, and no fixture renders those pages.
                  DROP='(^src/content(/|$)|/__tests__/|/__mocks__/|\.test\.tsx?$|\.md$)'

                  FILES=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
                  HITS=$(printf '%s\n' "$FILES" | grep -E "$KEEP" | grep -vE "$DROP" || true)

                  if [ -z "$HITS" ]; then
                      echo 'render=false' >> "$GITHUB_OUTPUT"
                      echo 'Nothing here can move a pixel. Skipping the visual diff.'
                      exit 0
                  fi
                  echo 'render=true' >> "$GITHUB_OUTPUT"
                  echo 'Files that can move a pixel:'
                  printf '%s\n' "$HITS"

    # Visual diff over src/dev/fixtures/registry.ts — 33 fixtures at four phone
    # widths, 132 PNGs. No API, no database, no provider key and no secret: a
    # fixture answers every request the app makes.
    #
    # ADVISORY. It is deliberately NOT in `ci-success.needs`, so it can never
    # block a merge. It is a review aid.
    #
    # Two roles, one set of steps, because the capture half is the same work:
    #   • push to dev or main → capture that commit and cache it as a baseline.
    #     The cache has to be written from the base branch: an entry written by
    #     a PR run is scoped to that PR, and no sibling PR can read it. Written
    #     from dev, ten PRs on that base restore it instead of building it.
    #   • pull request → capture the head, diff it against that baseline, and
    #     keep one comment up to date.
    ds-shots:
        name: ds-shots
        needs: [ds-shots-filter]
        # `always()` because ds-shots-filter never runs on a push, and a skipped
        # `needs` would otherwise skip this job too.
        if: >-
            always() &&
            ((github.event_name == 'push' && contains(fromJSON('["dev","main"]'), github.ref_name))
            || needs.ds-shots-filter.outputs.render == 'true')
        runs-on: ubuntu-latest
        # Build ~4m + capture ~2m on a runner, plus install. A hang past this is
        # a bug, not a slow day.
        timeout-minutes: 30
        permissions:
            # push the pr-assets-<number> branch that holds the PNGs
            contents: write
            # keep the one comment up to date
            pull-requests: write
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: true
                  token: ${{ secrets.SUBMODULE_TOKEN }}
                  # The asset push below builds its own remote URL, so the
                  # submodule PAT does not need to stay in .git/config.
                  persist-credentials: false

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'pnpm'

            - run: pnpm install --frozen-lockfile

            # Browser cache, moved here verbatim from the deleted `e2e` job. The
            # download is the step that hangs, so the cheapest fix is to not do
            # it on most runs. Keyed on the Playwright version, because browser
            # builds are pinned to it.
            - name: Resolve Playwright version
              id: pw
              run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              id: pw-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

            - name: Install Playwright browsers
              if: steps.pw-cache.outputs.cache-hit != 'true'
              timeout-minutes: 6
              run: npx playwright install --with-deps chromium

            # The cache holds browsers, not the apt packages they link against,
            # so system deps still need installing on a cache hit.
            #
            # `apt-get update` inside install-deps stalls intermittently on the
            # runner's Azure mirrors: three consecutive 6-minute timeouts on
            # 2026-08-19 (PR #2755), all of them ignoring
            # azure.archive.ubuntu.com and then hanging on noble-security, while
            # sibling runs minutes apart cleared the same step in seconds. The
            # stall is transient, so retry with a per-attempt cap — one bad
            # mirror then costs an attempt instead of the whole job — and drop
            # to the canonical archive after the first failure. `timeout` owns
            # the attempt's process group, so --kill-after reaps an apt child
            # that ignores the SIGTERM it sends first. Still exits
            # non-zero once the attempts are spent: a genuinely missing system
            # library must stay a red job, not a silent one.
            - name: Install Playwright system deps
              if: steps.pw-cache.outputs.cache-hit == 'true'
              timeout-minutes: 9
              run: |
                  for attempt in 1 2 3; do
                      if timeout --kill-after=15s 150 npx playwright install-deps chromium; then
                          exit 0
                      fi
                      echo "::warning::playwright install-deps attempt ${attempt} failed or stalled; retrying"
                      sudo rm -rf /var/lib/apt/lists/partial/* || true
                      if [ "${attempt}" = 1 ]; then
                          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
                              /etc/apt/sources.list.d/*.sources /etc/apt/sources.list || true
                      fi
                      sleep 5
                  done
                  echo "::error::playwright install-deps failed after 3 attempts"
                  exit 1

            - name: Build
              env:
                  # Without this DEV_TOOLS_ENABLED is false, ?__fixture= is
                  # ignored, and every screen redirects to /setup. It is a
                  # NEXT_PUBLIC_ value, so it must be set on the build, not on
                  # the capture — Next inlines it into the bundle here.
                  NEXT_PUBLIC_VERCEL_ENV: preview
              run: pnpm build

            # The capture fails a shot that still has a spinner on camera, on
            # purpose. No continue-on-error: a red step is how anyone finds out.
            - name: Capture screenshots
              env:
                  SHOTS_OUT: e2e/__shots__/${{ github.event_name == 'push' && 'base' || 'head' }}
              run: pnpm test:visual:capture

            # The four kept behaviour specs (setup reload-loop guard, icon
            # regression, send-link hydration, share-asset capture) run
            # nowhere else in CI. This job already has the preview build and
            # Chromium, so they cost seconds here.
            - name: Run regression specs
              run: pnpm test:e2e:regression

            - name: Save this commit as the baseline
              if: github.event_name == 'push'
              # A re-run of the same commit finds the key taken. Losing that
              # race costs nothing — the baseline is already there.
              continue-on-error: true
              uses: actions/cache/save@v4
              with:
                  path: e2e/__shots__/base
                  key: ds-shots-${{ github.sha }}

            - name: Restore the baseline capture
              if: github.event_name == 'pull_request'
              id: baseline
              uses: actions/cache/restore@v4
              with:
                  path: e2e/__shots__/base
                  key: ds-shots-${{ github.event.pull_request.base.sha }}
                  # If the exact base commit is not cached — it landed minutes
                  # ago, or the entry was evicted — take the newest baseline
                  # there is. The comment names the commit it actually used.
                  restore-keys: ds-shots-

            - name: Diff against the baseline
              if: github.event_name == 'pull_request'
              id: diff
              run: |
                  set -euo pipefail
                  MATCHED='${{ steps.baseline.outputs.cache-matched-key }}'
                  if [ -z "$MATCHED" ]; then
                      echo 'ready=false' >> "$GITHUB_OUTPUT"
                      echo 'No baseline is cached yet.'
                      exit 0
                  fi
                  echo "ready=true" >> "$GITHUB_OUTPUT"
                  echo "baseline=${MATCHED#ds-shots-}" >> "$GITHUB_OUTPUT"
                  node scripts/visual-diff.mjs e2e/__shots__/base e2e/__shots__/head \
                      --out=e2e/__shots__/diff --json > e2e/__shots__/report.json

            - name: Publish the changed screenshots
              if: steps.diff.outputs.ready == 'true'
              id: assets
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR: ${{ github.event.pull_request.number }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  set -euo pipefail
                  # GitHub renders an <img> from a URL and never from a workflow
                  # artifact, so the PNGs need a home the comment can link to.
                  # The repo convention is a pr-assets-<number> branch read over
                  # raw.githubusercontent (PRs #2727, #2733, #2748, #2758).
                  node scripts/visual-comment.mjs e2e/__shots__/report.json --list > e2e/__shots__/wanted.txt
                  if [ ! -s e2e/__shots__/wanted.txt ]; then
                      echo 'Nothing changed, so nothing to publish.'
                      exit 0
                  fi

                  SUB="visual/${HEAD_SHA:0:7}"
                  WORK="$RUNNER_TEMP/pr-assets"
                  mkdir -p "$WORK/$SUB/base" "$WORK/$SUB/head" "$WORK/$SUB/diff"
                  while read -r f; do
                      [ -n "$f" ] || continue
                      cp "e2e/__shots__/base/$f" "$WORK/$SUB/base/$f"
                      cp "e2e/__shots__/head/$f" "$WORK/$SUB/head/$f"
                      # A resized screen has no diff image. Not an error.
                      cp "e2e/__shots__/diff/$f" "$WORK/$SUB/diff/$f" 2>/dev/null || true
                  done < e2e/__shots__/wanted.txt

                  # A fresh orphan branch every push, force-pushed, so the
                  # branch holds only the current images and never grows. The
                  # commit-sha path keeps raw.githubusercontent from serving a
                  # cached image from the previous push.
                  git -C "$WORK" init -q -b "pr-assets-$PR"
                  git -C "$WORK" add -A
                  git -C "$WORK" \
                      -c user.name='github-actions[bot]' \
                      -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                      commit -qm "visual shots for #$PR"
                  git -C "$WORK" push -qf \
                      "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" \
                      "pr-assets-$PR"

                  echo "url=https://raw.githubusercontent.com/$GITHUB_REPOSITORY/pr-assets-$PR/$SUB" \
                      >> "$GITHUB_OUTPUT"

            - name: Render the comment
              if: github.event_name == 'pull_request'
              run: |
                  set -euo pipefail
                  if [ '${{ steps.diff.outputs.ready }}' != 'true' ]; then
                      {
                          echo '<!-- ds-shots -->'
                          echo '## 🖼 Visual diff — no baseline yet'
                          echo
                          echo 'Nothing is cached for `${{ github.base_ref }}`. The next push to that'
                          echo 'branch captures one, and this comment fills in on your next push here.'
                      } > e2e/__shots__/body.md
                  else
                      node scripts/visual-comment.mjs e2e/__shots__/report.json \
                          --assets='${{ steps.assets.outputs.url }}' \
                          --baseline='${{ steps.diff.outputs.baseline }}' \
                          --head='${{ github.event.pull_request.head.sha }}' > e2e/__shots__/body.md
                  fi
                  cat e2e/__shots__/body.md >> "$GITHUB_STEP_SUMMARY"

            # `always()` so a failed capture replaces the previous comment
            # instead of leaving a green one that is now a lie.
            - name: Comment on the PR
              if: always() && github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs')
                      const tag = '<!-- ds-shots -->'
                      const out = 'e2e/__shots__/body.md'
                      const body = fs.existsSync(out)
                          ? fs.readFileSync(out, 'utf8')
                          : `${tag}\n## 🖼 Visual diff — the capture failed\n\nNo screenshots this time. The job log says why.`

                      const comments = await github.paginate(github.rest.issues.listComments, {
                          issue_number: context.issue.number,
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          per_page: 100,
                      })
                      const existing = comments.find((c) => c.body && c.body.includes(tag))
                      const target = { owner: context.repo.owner, repo: context.repo.repo }
                      if (existing) {
                          await github.rest.issues.updateComment({ ...target, comment_id: existing.id, body })
                      } else {
                          await github.rest.issues.createComment({ ...target, issue_number: context.issue.number, body })
                      }

    # Coverage + test-summary aggregator. Mirrors the pattern from
    # peanut-api-ts/.github/workflows/tests.yaml `report` job.
    report:
        runs-on: ubuntu-latest
        # Wait for format + typecheck too — the report header says "all
        # green", which would lie if only unit results were considered
        # (per CR feedback on PR #1908).
        needs: [format, typecheck, unit]
        if: always()
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Download unit coverage
              uses: actions/download-artifact@v4
              continue-on-error: true
              with:
                  name: coverage-unit
                  path: coverage-raw/unit

            - name: Download unit JUnit
              uses: actions/download-artifact@v4
              continue-on-error: true
              with:
                  name: junit-unit
                  path: junit-raw/unit

            - name: Summarize
              id: report
              run: |
                  set -euo pipefail
                  mkdir -p coverage-merged coverage-input

                  [[ -f coverage-raw/unit/coverage-final.json ]] && cp coverage-raw/unit/coverage-final.json coverage-input/unit.json || echo "no unit coverage"

                  if ls coverage-input/*.json >/dev/null 2>&1; then
                      npx --yes nyc@15 merge coverage-input coverage-merged/coverage-final.json
                      npx --yes nyc@15 report --reporter=json-summary --temp-dir=coverage-merged --report-dir=coverage-merged
                  else
                      echo '{"total":{"statements":{"pct":0},"branches":{"pct":0},"functions":{"pct":0},"lines":{"pct":0}}}' > coverage-merged/coverage-summary.json
                  fi

                  node -e "
                  const fs = require('fs');
                  let cov = { total: { statements:{pct:0}, branches:{pct:0}, functions:{pct:0}, lines:{pct:0} } };
                  try { cov = JSON.parse(fs.readFileSync('coverage-merged/coverage-summary.json','utf8')); } catch {}

                  function decode(s) {
                      return s.replaceAll('&amp;','&').replaceAll('&lt;','<').replaceAll('&gt;','>').replaceAll('&quot;','\"').replaceAll('&apos;','\\'');
                  }

                  function parseJunit(p, label) {
                      try {
                          const xml = fs.readFileSync(p,'utf8');
                          const tests = parseInt((xml.match(/<testsuites [^>]*tests=\"(\d+)\"/) || [])[1] || '0', 10);
                          const failures = parseInt((xml.match(/<testsuites [^>]*failures=\"(\d+)\"/) || [])[1] || '0', 10);
                          const skipped = parseInt((xml.match(/<testsuites [^>]*skipped=\"(\d+)\"/) || [])[1] || '0', 10);
                          const time = parseFloat((xml.match(/<testsuites [^>]*time=\"([\d.]+)\"/) || [])[1] || '0');
                          const cases = [];
                          for (const m of xml.matchAll(/<testsuite name=\"([^\"]+)\"[^>]*>([\\s\\S]*?)<\\/testsuite>/g)) {
                              const file = decode(m[1]);
                              for (const tc of m[2].matchAll(/<testcase[^>]*classname=\"([^\"]*)\"[^>]*name=\"([^\"]+)\"[^>]*time=\"([\d.]+)\"[^>]*(\\/>|>([\\s\\S]*?)<\\/testcase>)/g)) {
                                  const failed = tc[5] && /<failure/.test(tc[5]);
                                  cases.push({ file, project: label, suite: decode(tc[1]), name: decode(tc[2]), time: parseFloat(tc[3]), failed: !!failed });
                              }
                          }
                          return { tests, failures, skipped, time, cases };
                      } catch { return null; }
                  }

                  const unit = parseJunit('junit-raw/unit/junit.xml','unit');
                  const allCases = unit?.cases || [];
                  const failed = allCases.filter(c => c.failed);
                  const slowest = [...allCases].sort((a,b) => b.time - a.time).slice(0, 10);
                  fs.writeFileSync('report-payload.json', JSON.stringify({ cov, unit, failed, slowest }, null, 2));
                  "

            - name: Comment on PR
              if: github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const p = JSON.parse(fs.readFileSync('report-payload.json','utf8'));
                      const pct = (n) => (n == null ? '—' : `${n.toFixed(1)}%`);
                      const dur = (n) => (n == null ? '—' : n >= 60 ? `${(n/60).toFixed(1)}m` : `${n.toFixed(1)}s`);

                      const status = p.failed.length === 0 ? '✅ all green' : `🔴 ${p.failed.length} failing`;
                      const suiteLine = (label, s) => {
                          if (!s) return `- **${label}**: skipped / unavailable`;
                          const icon = s.failures > 0 ? '🔴' : '✅';
                          return `- ${icon} **${label}**: ${s.tests - s.skipped} ran, ${s.failures} failed, ${s.skipped} skipped, ${dur(s.time)}`;
                      };
                      const failedBlock = p.failed.length === 0 ? '' : [
                          '### 🔴 Failing tests',
                          '',
                          ...p.failed.map(c => `- \`${c.file}\` › ${c.suite ? c.suite + ' › ' : ''}**${c.name}** — ${c.time.toFixed(2)}s`),
                          '',
                      ].join('\n');
                      const slowBlock = p.slowest.length === 0 ? '' : [
                          '<details><summary>⏱ 10 slowest test cases</summary>',
                          '',
                          '| time | test |',
                          '| ---: | --- |',
                          ...p.slowest.map(c => `| ${c.time >= 5 ? '🐢 ' : ''}${dur(c.time)} | \`${c.file}\` › ${c.name} |`),
                          '',
                          '</details>',
                      ].join('\n');
                      const covBlock = [
                          '### 📊 Coverage (unit)',
                          '',
                          '| metric | % |',
                          '| --- | ---: |',
                          `| statements | ${pct(p.cov.total.statements?.pct)} |`,
                          `| branches   | ${pct(p.cov.total.branches?.pct)} |`,
                          `| functions  | ${pct(p.cov.total.functions?.pct)} |`,
                          `| lines      | ${pct(p.cov.total.lines?.pct)} |`,
                      ].join('\n');

                      const body = [
                          '<!-- ui-test-report -->',
                          `## 🧪 UI test report — ${status}`,
                          '',
                          '### Suites',
                          suiteLine('unit', p.unit),
                          '',
                          failedBlock,
                          covBlock,
                          '',
                          slowBlock,
                          '',
                          '<sub>📍 Inline annotations are in the **Unit test report** check above. Coverage artifact: `coverage-unit`. Generated by `.github/workflows/tests.yml`.</sub>',
                      ].filter(Boolean).join('\n');

                      const tag = '<!-- ui-test-report -->';
                      // Paginate so the idempotent-update lookup doesn't break once
                      // a PR accumulates >30 comments (CR feedback on #1908).
                      const comments = await github.paginate(github.rest.issues.listComments, {
                          issue_number: context.issue.number,
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          per_page: 100,
                      });
                      const existing = comments.find(c => c.body && c.body.includes(tag));
                      if (existing) {
                          await github.rest.issues.updateComment({
                              comment_id: existing.id,
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              body,
                          });
                      } else {
                          await github.rest.issues.createComment({
                              issue_number: context.issue.number,
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              body,
                          });
                      }

    # Human-only authorship gate. Every commit on the PR must be authored by a
    # repo collaborator's own GitHub account — no `*[bot]` authors (claude[bot],
    # github-actions[bot], …) and no emails that GitHub cannot map to an
    # account. Policy set 2026-08-24: AI is a tool, not an owner; every commit
    # has a human who is accountable for it. Cloud coding sessions that commit
    # as claude[bot] are exactly what this blocks. Content-publish PRs pass:
    # update-content.yml authors and signs its commit as a human account.
    #
    # No allowlist to maintain: "has write access to this repo" IS the team
    # roster, and GitHub org/repo access management keeps it current. The
    # per-user permission endpoint works with the default GITHUB_TOKEN.
    human-authors:
        name: human-authors
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        # The workflow-level permissions block drops pull-requests, and the
        # commit-listing endpoint 403s without it.
        permissions:
            pull-requests: read
        steps:
            - name: Verify every commit is authored by a team member
              uses: actions/github-script@v7
              with:
                  script: |
                      const memberCache = new Map();
                      async function hasWriteAccess(login) {
                        if (memberCache.has(login)) return memberCache.get(login);
                        let ok = false;
                        try {
                          const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            username: login,
                          });
                          ok = ['admin', 'maintain', 'write'].includes(data.permission);
                        } catch (e) {
                          ok = false;
                        }
                        memberCache.set(login, ok);
                        return ok;
                      }
                      const commits = await github.paginate(github.rest.pulls.listCommits, {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: context.payload.pull_request.number,
                        per_page: 100,
                      });
                      const bad = [];
                      for (const c of commits) {
                        const sha = c.sha.slice(0, 7);
                        const login = c.author && c.author.login;
                        const email = (c.commit.author && c.commit.author.email) || 'unknown';
                        if (!login) {
                          bad.push(`${sha}: author email <${email}> is not linked to a GitHub account — commit from your own account (git config user.email must be an email verified on your GitHub profile)`);
                        } else if (login.endsWith('[bot]')) {
                          bad.push(`${sha}: authored by ${login} — bot-authored commits are not allowed; commit as yourself`);
                        } else if (!(await hasWriteAccess(login))) {
                          bad.push(`${sha}: authored by ${login}, who has no write access to this repo`);
                        }
                      }
                      if (bad.length) {
                        core.setFailed(`Commits must be authored by a team member:\n${bad.join('\n')}`);
                      } else {
                        console.log(`✅ All ${commits.length} commits are authored by team members`);
                      }

    # Single umbrella check that aggregates all required test/quality jobs.
    # Branch protection on `dev`/`main` requires only `ci-success` instead of
    # listing every individual job — keeps the ruleset stable as jobs are
    # added/renamed. To gate a new job: add it to `needs:` here.
    #
    # `if: always()` so this runs even when an upstream fails. Explicit
    # `failure || cancelled` check because GitHub treats `skipped` as neutral
    # (an upstream skip would silently let this pass without the explicit gate).
    ci-success:
        name: ci-success
        if: always()
        needs: [format, ds-lint, eslint, typecheck, unit, report, human-authors]
        runs-on: ubuntu-latest
        steps:
            - name: Verify all required jobs passed
              run: |
                  if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
                      echo "::error::One or more required jobs failed or were cancelled"
                      echo "Job results:"
                      echo "  format:    ${{ needs.format.result }}"
                      echo "  ds-lint:   ${{ needs['ds-lint'].result }}"
                      echo "  eslint:    ${{ needs.eslint.result }}"
                      echo "  typecheck: ${{ needs.typecheck.result }}"
                      echo "  unit:      ${{ needs.unit.result }}"
                      echo "  report:    ${{ needs.report.result }}"
                      echo "  human-authors: ${{ needs['human-authors'].result }}"
                      exit 1
                  fi
                  echo "✅ All required jobs passed"
