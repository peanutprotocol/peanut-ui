apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Version is sourced from the release pipeline so it always increments without a
// manual edit. Play requires each upload's versionCode to exceed the last; the
// rejected first submission was code 1, so we never emit below 2.
//   - versionName: ANDROID_VERSION_NAME env, else package.json "version"
//   - versionCode: ANDROID_VERSION_CODE env (set by scripts/native-release.sh),
//     else the git commit count — monotonic and zero-bookkeeping, so even a raw
//     `./gradlew bundleRelease` produces a valid, increasing code.
def pkgVersion = '1.0.0'
try {
    def pkgJson = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
    if (pkgJson.version) pkgVersion = pkgJson.version
} catch (Exception e) {
    logger.warn("Could not read version from package.json: ${e.message}")
}

def gitCommitCount = {
    try {
        def proc = ['git', 'rev-list', '--count', 'HEAD'].execute(null, rootProject.projectDir)
        proc.waitFor()
        def out = proc.in.text.trim()
        if (out.isInteger() && out.toInteger() >= 2) return out.toInteger()
    } catch (Exception e) {
        logger.warn("Could not derive versionCode from git: ${e.message}")
    }
    return 2 // floor — rejected first upload was code 1
}

def resolvedVersionName = System.getenv('ANDROID_VERSION_NAME') ?: pkgVersion
def resolvedVersionCode = (System.getenv('ANDROID_VERSION_CODE')?.isInteger()
        ? System.getenv('ANDROID_VERSION_CODE').toInteger()
        : gitCommitCount())

android {
    namespace = "me.peanut.wallet"
    compileSdk = rootProject.ext.compileSdkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId "me.peanut.wallet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // sentry dsn for native crash reporting (TASK-20964). injected by ci
        // (android-release.yml); empty locally, which disables the sdk.
        def sentryDsnEnv = System.getenv('SENTRY_DSN_ANDROID') ?: ''
        if (sentryDsnEnv.isEmpty()) {
            logger.error('SENTRY_DSN_ANDROID not set — native crash reporting will be DISABLED in this build. Fine locally; a release build without it ships blind.')
        }
        manifestPlaceholders = [sentryDsn: sentryDsnEnv]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            // Stored uncompressed so the WebView mmaps them instead of inflating
            // per read — the app re-reads these across full-document reloads.
            // Play recompresses for download, so transfer size is unaffected.
            noCompress 'js', 'css', 'html', 'json', 'svg', 'woff2', 'map'
        }
    }
    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'] ?: '../peanut-release.keystore')
            storePassword keystoreProperties['storePassword'] ?: ''
            keyAlias keystoreProperties['keyAlias'] ?: 'peanut'
            keyPassword keystoreProperties['keyPassword'] ?: ''
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

/*
 * MeaWallet MPP SDK (Google Pay push provisioning) — credential-gated.
 * The artifact lives on MeaWallet's private Nexus (repo declared in the root
 * build.gradle), so both the dependency and PushProvisioningPlugin.java (in
 * src/meawallet/java) are compiled only when credentials are present — CI
 * release builds and devs who fetched the 1Password credentials. Without them
 * the build stays green and MainActivity's reflection lookup of the plugin
 * silently no-ops, so the web layer falls back to the manual carousel.
 */
def meaWalletCreds = System.getenv('MEAWALLET_NEXUS_USER') ?: (findProperty('MEAWALLET_NEXUS_USER') ?: null)
if (meaWalletCreds) {
    logger.lifecycle('[meawallet] Nexus credentials present — MPP SDK enabled')
    android.sourceSets.main.java.srcDirs += 'src/meawallet/java'
    dependencies {
        debugImplementation 'com.meawallet:mpp-prod:2.1.0-debug'
        releaseImplementation 'com.meawallet:mpp-prod:2.1.0'
    }
} else {
    logger.lifecycle('[meawallet] no Nexus credentials — building without MPP SDK (push provisioning stubbed)')
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // credential manager provider — required for capacitor-webauthn passkeys
    implementation "androidx.credentials:credentials:1.5.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"

    // play install referrer — deferred deep linking (InstallReferrerPlugin.java)
    implementation "com.android.installreferrer:installreferrer:2.2"

    // sentry native crash reporting (TASK-20964) — configured via AndroidManifest
    // meta-data, auto-inits before Application. deliberately the aggregate
    // artifact (core + ndk): the webview renderer and capacitor plugins crash at
    // the c/c++ level, and ndk capture is exactly the visibility the beta needs.
    // 8.49.0 = newest version past the 14-day supply-chain floor when added
    // (2026-08-03).
    implementation "io.sentry:sentry-android:8.49.0"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// No google-services plugin: OneSignal registers with FCM on its own —
// PushRegistratorFCM builds FirebaseOptions in code from the sender ID served
// by the OneSignal dashboard, and firebase-messaging arrives transitively via
// com.onesignal:notifications. See docs/NATIVE-RELEASE.md §Android push.
